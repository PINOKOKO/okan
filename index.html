<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>オカン育成ゲーム</title>
<style>
    body {
        background-color: #f0f0f0;
        font-family: 'Helvetica Neue', Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    /* ゲーム画面全体の外枠 */
    .game-screen {
        background-color: #dcdcdc; /* ベゼルの色 */
        width: 360px;
        height: 640px;
        border-radius: 40px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        position: relative;
        overflow: hidden;
        border: 4px solid #b0b0b0;
    }

    /* 液晶画面部分 */
    .lcd-display {
        background-color: #a3c98f; /* 液晶の背景色 */
        width: 320px;
        height: 440px;
        position: absolute;
        top: 20px;
        left: 20px;
        border-radius: 20px;
        border: 4px solid #556b2f; /* 液晶の内枠 */
        box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        overflow: hidden;
    }

    /* 背景のアート（SVGで描画） */
    .background-art {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
    }

    /* オカンのドット絵キャラクター（修正版） */
    .okan-char {
        position: absolute;
        bottom: 120px; /* 床の位置に合わせる */
        left: 30px;
        width: 100px;
        height: 60px;
        z-index: 2;
    }

    /* ごろ寝しているテキスト */
    .action-text {
        position: absolute;
        bottom: 20px;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: 18px;
        font-weight: bold;
        color: #2f4f2f;
        z-index: 3;
        font-family: 'Courier New', Courier, monospace;
    }

    /* 下部のステータスパネル */
    .status-panel {
        background-color: #333;
        width: 320px;
        height: 140px;
        position: absolute;
        bottom: 20px;
        left: 20px;
        border-radius: 15px;
        color: #fff;
        padding: 15px;
        box-sizing: border-box;
        font-size: 16px;
        font-family: 'Courier New', Courier, monospace;
        z-index: 10;
    }

    .status-item {
        margin-bottom: 8px;
        display: flex;
        align-items: center;
    }

    .heart {
        color: #ff4500;
        margin-left: 5px;
    }

    .heart-empty {
        color: #555;
        margin-left: 5px;
    }

    /* 操作ボタン */
    .control-buttons {
        position: absolute;
        bottom: -150px; /* 画面外に配置 */
        left: 20px;
        width: 320px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        z-index: 20;
    }

    .btn {
        background-color: #fff;
        border: 2px solid #000;
        border-radius: 10px;
        padding: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 0 #000;
        transition: all 0.1s;
    }

    .btn:active {
        box-shadow: 0 0 0 #000;
        transform: translateY(4px);
    }

    .btn-icon {
        margin-right: 5px;
    }

</style>
</head>
<body>

<div class="game-screen">
    <!-- 液晶画面 -->
    <div class="lcd-display">
        <!-- 背景のアートワーク -->
        <svg class="background-art" viewBox="0 0 320 440">
            <!-- 壁の棚とアイテム -->
            <line x1="20" y1="100" x2="300" y2="100" stroke="#556b2f" stroke-width="2"/>
            <line x1="20" y1="180" x2="300" y2="180" stroke="#556b2f" stroke-width="2"/>
            
            <!-- 丸い飾り -->
            <circle cx="70" cy="140" r="30" stroke="#556b2f" stroke-width="2" fill="none"/>
            <line x1="70" y1="110" x2="70" y2="170" stroke="#556b2f" stroke-width="1.5"/>
            <line x1="40" y1="140" x2="100" y2="140" stroke="#556b2f" stroke-width="1.5"/>
            
            <!-- 額縁（富士） -->
            <rect x="140" y="50" width="40" height="70" stroke="#556b2f" stroke-width="2" fill="none"/>
            <text x="148" y="90" font-family="Arial" font-size="12" fill="#556b2f">富士</text>
            
            <!-- テレビ -->
            <rect x="220" y="80" width="60" height="50" rx="10" ry="10" stroke="#556b2f" stroke-width="2" fill="none"/>
            <rect x="228" y="88" width="35" height="34" stroke="#556b2f" stroke-width="1.5" fill="none"/>
            <circle cx="270" cy="98" r="3" fill="#556b2f"/>
            <circle cx="270" cy="112" r="3" fill="#556b2f"/>
            <line x1="230" y1="80" x2="225" y2="65" stroke="#556b2f" stroke-width="1.5"/>
            <line x1="270" y1="80" x2="275" y2="65" stroke="#556b2f" stroke-width="1.5"/>
            
            <!-- 床のライン -->
            <line x1="0" y1="280" x2="320" y2="280" stroke="#556b2f" stroke-width="3"/>
            <line x1="20" y1="310" x2="300" y2="310" stroke="#556b2f" stroke-width="2" stroke-dasharray="5,5"/>
            
            <!-- ちゃぶ台 -->
            <ellipse cx="160" cy="305" rx="50" ry="20" stroke="#556b2f" stroke-width="2" fill="none"/>
            <rect x="145" y="288" width="10" height="8" stroke="#556b2f" stroke-width="1" fill="none"/>
            <rect x="160" y="292" width="10" height="5" stroke="#556b2f" stroke-width="1" fill="none"/>
        </svg>

        <!-- オカンのドット絵キャラクター（修正版） -->
        <svg class="okan-char" viewBox="0 0 100 60">
            <!-- 影（薄く） -->
            <rect x="0" y="55" width="100" height="5" fill="#c0d9af"/>
            
            <!-- 1. 空洞部分を白で塗りつぶし -->
            <rect x="5" y="30" width="25" height="18" fill="#FFFFFF"/>

            <!-- 2. 顔と胴体の黒い輪郭を白く塗りつぶし (肌色の顔ブロック全体を白に変更) -->
            <rect x="30" y="10" width="25" height="38" fill="#FFFFFF"/>
            
            <!-- 3. 茶色の髪のブロック (そのまま) -->
            <rect x="10" y="10" width="20" height="20" fill="#a0522d"/>
            
            <!-- 4. 胴体右側の黄色と白のブロック (そのまま) -->
            <rect x="55" y="10" width="10" height="38" fill="#FFD700"/>
            <rect x="65" y="10" width="15" height="38" fill="#FFFFFF"/>
            
            <!-- 5. 肌色の手/足ブロック (そのまま) -->
            <rect x="80" y="30" width="15" height="18" fill="#ffe4c4"/>
        </svg>

        <!-- アクションテキスト -->
        <div class="action-text">ちゃぶ台の横でゴロゴロ寝転がっている</div>
    </div>

    <!-- ステータスパネル -->
    <div class="status-panel">
        <div class="status-item">機嫌: <span class="heart">❤️</span><span class="heart">❤️</span><span class="heart-empty">🖤</span><span class="heart-empty">🖤</span><span class="heart-empty">🖤</span></div>
        <div class="status-item">体重: 55.5 kg</div>
        <div class="status-item">行動: ゴロゴロ居眠り</div>
    </div>

    <!-- 操作ボタン -->
    <div class="control-buttons">
        <button class="btn"><span class="btn-icon">🍶</span>お酒あげる</button>
        <button class="btn"><span class="btn-icon">🥜</span>おつまみ</button>
        <button class="btn"><span class="btn-icon">🧹</span>部屋掃除</button>
        <button class="btn"><span class="btn-icon">💬</span>話しかける</button>
    </div>
</div>

</body>
</html>
