<title>オカン育成</title>
<style>
  :root {
    --pixel-color: #0f380f; /* オカンのドット色（濃い緑黒） */
    --p-size: 2px; /* ドットの1ピクセルサイズ */
  }

  body {
    background-color: #1a1a1a;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 本体フレーム */
  .game-container {
    background-color: #e2e0d8;
    border: 4px solid #333;
    width: 88vw;
    max-width: 340px;
    padding: 20px;
    text-align: center;
    border-radius: 42px;
    box-shadow: 0 9px 0 #000, inset 0 4px 0 rgba(255,255,255,0.6);
    position: relative;
  }

  /* 液晶画面枠 */
  .screen {
    background-color: #8bac0f;
    border: 4px solid #0f380f;
    height: 230px;
    margin-bottom: 12px;
    border-radius: 10px;
    position: relative;
    overflow: hidden;
    box-shadow: inset 3px 3px 8px rgba(0,0,0,0.4);
  }

  /* --- 居間の静止画背景（SVGイラスト） --- */
  .room-svg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 195px;
    opacity: 0.85; /* うっすら背景にしてドットオカンを目立たせる */
  }

  /* -------------------------------------
     解像度アップ！24x24マス ドット絵オカン
  ------------------------------------- */
  .okan-pixel {
    position: absolute;
    width: calc(var(--p-size) * 24);
    height: calc(var(--p-size) * 24);
    transition: all 0.2s steps(4);
    z-index: 10;
  }

  .okan-pixel::after {
    content: ''; position: absolute;
    width: var(--p-size); height: var(--p-size);
    background: transparent;
  }

  /* --- 高精細：立ち姿オカン (パーマ・ニコニコ顔・割烹着) --- */
  .pose-stand::after {
    box-shadow: 
      /* パーマ髪 */
      calc(var(--p-size)*8) calc(var(--p-size)*1) var(--pixel-color), calc(var(--p-size)*9) calc(var(--p-size)*1) var(--pixel-color), calc(var(--p-size)*10) calc(var(--p-size)*1) var(--pixel-color), calc(var(--p-size)*11) calc(var(--p-size)*1) var(--pixel-color), calc(var(--p-size)*12) calc(var(--p-size)*1) var(--pixel-color), calc(var(--p-size)*13) calc(var(--p-size)*1) var(--pixel-color), calc(var(--p-size)*14) calc(var(--p-size)*1) var(--pixel-color), calc(var(--p-size)*15) calc(var(--p-size)*1) var(--pixel-color),
      calc(var(--p-size)*6) calc(var(--p-size)*2) var(--pixel-color), calc(var(--p-size)*7) calc(var(--p-size)*2) var(--pixel-color), calc(var(--p-size)*16) calc(var(--p-size)*2) var(--pixel-color), calc(var(--p-size)*17) calc(var(--p-size)*2) var(--pixel-color),
      calc(var(--p-size)*5) calc(var(--p-size)*3) var(--pixel-color), calc(var(--p-size)*18) calc(var(--p-size)*3) var(--pixel-color),
      calc(var(--p-size)*4) calc(var(--p-size)*4) var(--pixel-color), calc(var(--p-size)*19) calc(var(--p-size)*4) var(--pixel-color),
      calc(var(--p-size)*4) calc(var(--p-size)*5) var(--pixel-color), calc(var(--p-size)*19) calc(var(--p-size)*5) var(--pixel-color),
      calc(var(--p-size)*5) calc(var(--p-size)*6) var(--pixel-color), calc(var(--p-size)*18) calc(var(--p-size)*6) var(--pixel-color),
      /* 顔・可愛い表情 */
      calc(var(--p-size)*7) calc(var(--p-size)*7) var(--pixel-color), calc(var(--p-size)*8) calc(var(--p-size)*7) var(--pixel-color), calc(var(--p-size)*15) calc(var(--p-size)*7) var(--pixel-color), calc(var(--p-size)*16) calc(var(--p-size)*7) var(--pixel-color), /* 目(ニッコリ) */
      calc(var(--p-size)*6) calc(var(--p-size)*8) var(--pixel-color), calc(var(--p-size)*9) calc(var(--p-size)*8) var(--pixel-color), calc(var(--p-size)*14) calc(var(--p-size)*8) var(--pixel-color), calc(var(--p-size)*17) calc(var(--p-size)*8) var(--pixel-color),
      calc(var(--p-size)*11) calc(var(--p-size)*10) var(--pixel-color), calc(var(--p-size)*12) calc(var(--p-size)*10) var(--pixel-color), /* にっこり口 */
      calc(var(--p-size)*10) calc(var(--p-size)*11) var(--pixel-color), calc(var(--p-size)*13) calc(var(--p-size)*11) var(--pixel-color),
      /* 割烹着（フリル・結び目） */
      calc(var(--p-size)*7) calc(var(--p-size)*13) var(--pixel-color), calc(var(--p-size)*8) calc(var(--p-size)*13) var(--pixel-color), calc(var(--p-size)*15) calc(var(--p-size)*13) var(--pixel-color), calc(var(--p-size)*16) calc(var(--p-size)*13) var(--pixel-color),
      calc(var(--p-size)*5) calc(var(--p-size)*14) var(--pixel-color), calc(var(--p-size)*18) calc(var(--p-size)*14) var(--pixel-color),
      calc(var(--p-size)*4) calc(var(--p-size)*15) var(--pixel-color), calc(var(--p-size)*19) calc(var(--p-size)*15) var(--pixel-color),
      calc(var(--p-size)*4) calc(var(--p-size)*18) var(--pixel-color), calc(var(--p-size)*19) calc(var(--p-size)*18) var(--pixel-color),
      calc(var(--p-size)*5) calc(var(--p-size)*19) var(--pixel-color), calc(var(--p-size)*6) calc(var(--p-size)*19) var(--pixel-color), calc(var(--p-size)*17) calc(var(--p-size)*19) var(--pixel-color), calc(var(--p-size)*18) calc(var(--p-size)*19) var(--pixel-color), /* 裾 */
      /* 足 */
      calc(var(--p-size)*7) calc(var(--p-size)*20) var(--pixel-color), calc(var(--p-size)*8) calc(var(--p-size)*20) var(--pixel-color), calc(var(--p-size)*15) calc(var(--p-size)*20) var(--pixel-color), calc(var(--p-size)*16) calc(var(--p-size)*20) var(--pixel-color),
      calc(var(--p-size)*6) calc(var(--p-size)*21) var(--pixel-color), calc(var(--p-size)*7) calc(var(--p-size)*21) var(--pixel-color), calc(var(--p-size)*8) calc(var(--p-size)*21) var(--pixel-color), calc(var(--p-size)*15) calc(var(--p-size)*21) var(--pixel-color), calc(var(--p-size)*16) calc(var(--p-size)*21) var(--pixel-color), calc(var(--p-size)*17) calc(var(--p-size)*21) var(--pixel-color)
    ;
  }

  /* --- 高精細：ひじまくら・ごろ寝オカン --- */
  .pose-lay::after {
    box-shadow: 
      /* ひじまくらの手 */
      calc(var(--p-size)*2) calc(var(--p-size)*12) var(--pixel-color), calc(var(--p-size)*3) calc(var(--p-size)*13) var(--pixel-color), calc(var(--p-size)*4) calc(var(--p-size)*14) var(--pixel-color), calc(var(--p-size)*5) calc(var(--p-size)*15) var(--pixel-color),
      /* 頭 (パーマ) */
      calc(var(--p-size)*4) calc(var(--p-size)*7) var(--pixel-color), calc(var(--p-size)*5) calc(var(--p-size)*6) var(--pixel-color), calc(var(--p-size)*6) calc(var(--p-size)*5) var(--pixel-color), calc(var(--p-size)*7) calc(var(--p-size)*5) var(--pixel-color), calc(var(--p-size)*8) calc(var(--p-size)*5) var(--pixel-color),
      calc(var(--p-size)*3) calc(var(--p-size)*8) var(--pixel-color), calc(var(--p-size)*3) calc(var(--p-size)*9) var(--pixel-color), calc(var(--p-size)*3) calc(var(--p-size)*10) var(--pixel-color),
      /* 顔 (寝ている目) */
      calc(var(--p-size)*6) calc(var(--p-size)*9) var(--pixel-color), calc(var(--p-size)*7) calc(var(--p-size)*9) var(--pixel-color), calc(var(--p-size)*8) calc(var(--p-size)*9) var(--pixel-color),
      /* 横たわった体（割烹着） */
      calc(var(--p-size)*9) calc(var(--p-size)*11) var(--pixel-color), calc(var(--p-size)*10) calc(var(--p-size)*11) var(--pixel-color), calc(var(--p-size)*11) calc(var(--p-size)*11) var(--pixel-color), calc(var(--p-size)*12) calc(var(--p-size)*11) var(--pixel-color), calc(var(--p-size)*13) calc(var(--p-size)*11) var(--pixel-color), calc(var(--p-size)*14) calc(var(--p-size)*11) var(--pixel-color), calc(var(--p-size)*15) calc(var(--p-size)*11) var(--pixel-color),
      calc(var(--p-size)*8) calc(var(--p-size)*16) var(--pixel-color), calc(var(--p-size)*9) calc(var(--p-size)*16) var(--pixel-color), calc(var(--p-size)*10) calc(var(--p-size)*16) var(--pixel-color), calc(var(--p-size)*11) calc(var(--p-size)*16) var(--pixel-color), calc(var(--p-size)*12) calc(var(--p-size)*16) var(--pixel-color), calc(var(--p-size)*13) calc(var(--p-size)*16) var(--pixel-color), calc(var(--p-size)*14) calc(var(--p-size)*16) var(--pixel-color), calc(var(--p-size)*15) calc(var(--p-size)*16) var(--pixel-color),
      /* 曲げた足 */
      calc(var(--p-size)*16) calc(var(--p-size)*12) var(--pixel-color), calc(var(--p-size)*17) calc(var(--p-size)*13) var(--pixel-color), calc(var(--p-size)*18) calc(var(--p-size)*14) var(--pixel-color),
      calc(var(--p-size)*16) calc(var(--p-size)*15) var(--pixel-color), calc(var(--p-size)*17) calc(var(--p-size)*16) var(--pixel-color)
    ;
  }

  /* 位置関係（ちゃぶ台やテレビに合わせて最適化） */
  .pos-tv { top: 75px; right: 20px; }
  .pos-chabudai-left { top: 110px; left: 15px; }
  .pos-chabudai-right { top: 110px; right: 25px; }
  .pos-center { top: 85px; left: 38%; }

  /* ⭐ おならアニメーション (吹き出しドット) ⭐ */
  .fart-pixel {
    position: absolute;
    width: var(--p-size); height: var(--p-size);
    background: transparent;
    opacity: 0;
    z-index: 15;
  }
  
  .pos-chabudai-left .fart-pixel {
    top: calc(var(--p-size) * 12);
    right: calc(var(--p-size) * -2);
  }

  .fart-active {
    animation: fart-puff 1.2s steps(3) infinite;
  }

  @keyframes fart-puff {
    0% {
      opacity: 1;
      box-shadow: calc(var(--p-size)*0) calc(var(--p-size)*0) var(--pixel-color);
    }
    50% {
      opacity: 1;
      box-shadow: 
        calc(var(--p-size)*1) calc(var(--p-size)*-2) var(--pixel-color), calc(var(--p-size)*2) calc(var(--p-size)*-2) var(--pixel-color),
        calc(var(--p-size)*0) calc(var(--p-size)*0) var(--pixel-color), calc(var(--p-size)*3) calc(var(--p-size)*0) var(--pixel-color),
        calc(var(--p-size)*1) calc(var(--p-size)*2) var(--pixel-color), calc(var(--p-size)*2) calc(var(--p-size)*2) var(--pixel-color);
    }
    100% {
      opacity: 0;
      box-shadow: 
        calc(var(--p-size)*3) calc(var(--p-size)*-3) var(--pixel-color), calc(var(--p-size)*4) calc(var(--p-size)*-3) var(--pixel-color),
        calc(var(--p-size)*2) calc(var(--p-size)*0) var(--pixel-color), calc(var(--p-size)*5) calc(var(--p-size)*0) var(--pixel-color),
        calc(var(--p-size)*3) calc(var(--p-size)*3) var(--pixel-color), calc(var(--p-size)*4) calc(var(--p-size)*3) var(--pixel-color);
    }
  }

  /* ドラクエ風掃除アニメ */
  @keyframes clean-dq {
    0% { left: 10px; top: 110px; transform: scaleX(1); }
    50% { left: 200px; top: 80px; transform: scaleX(-1); }
    100% { left: 10px; top: 110px; transform: scaleX(1); }
  }
  .anim-cleaning {
    animation: clean-dq 3s infinite steps(6) !important;
  }

  .dialogue-box {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 35px;
    background: #8bac0f;
    border-top: 3px solid #0f380f;
    font-size: 11px; font-weight: bold;
    color: #0f380f;
    display: flex; align-items: center; justify-content: center;
    padding: 0 5px;
  }

  .status {
    margin-bottom: 12px; text-align: left; font-size: 12px;
    background: #222; padding: 8px 12px;
    border-radius: 8px; border: 2px solid #444;
  }

  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  button {
    background-color: #fff; color: #000; border: 3px solid #000;
    padding: 10px 4px; font-weight: bold; cursor: pointer;
    font-size: 11px; border-radius: 10px;
    box-shadow: 0 3px 0 #000;
  }
  button:active { box-shadow: 0 0 0 #000; transform: translateY(3px); }
</style>
</head>
<body>

<div class="game-container" id="game" style="display:none;">
  <div class="screen">
    
    <!-- 🖼️ 昭和の居間（静止画SVGイラスト背景） -->
    <svg class="room-svg" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
      <!-- 障子風の壁背景 -->
      <rect x="0" y="0" width="200" height="110" fill="#789c0a"/>
      <line x1="0" y1="30" x2="200" y2="30" stroke="#0f380f" stroke-width="1" opacity="0.3"/>
      <line x1="0" y1="70" x2="200" y2="70" stroke="#0f380f" stroke-width="1" opacity="0.3"/>
      
      <!-- 丸窓と床の間（掛け軸） -->
      <circle cx="30" cy="40" r="18" fill="none" stroke="#0f380f" stroke-width="2"/>
      <line x1="30" y1="22" x2="30" y2="58" stroke="#0f380f" stroke-width="1"/>
      <line x1="12" y1="40" x2="48" y2="40" stroke="#0f380f" stroke-width="1"/>

      <rect x="85" y="10" width="30" height="50" fill="none" stroke="#0f380f" stroke-width="1.5"/>
      <rect x="90" y="18" width="20" height="34" fill="#0f380f" opacity="0.15"/>
      <text x="94" y="38" font-size="8" fill="#0f380f" font-weight="bold">富士</text>

      <!-- 昭和テレビ（右奥） -->
      <rect x="150" y="35" width="40" height="30" rx="3" fill="none" stroke="#0f380f" stroke-width="2"/>
      <rect x="154" y="39" width="24" height="22" rx="2" fill="#0f380f" opacity="0.2"/>
      <circle cx="183" cy="44" r="2" fill="#0f380f"/>
      <circle cx="183" cy="52" r="2" fill="#0f380f"/>
      <line x1="160" y1="35" x2="152" y2="20" stroke="#0f380f" stroke-width="1.5"/>
      <line x1="170" y1="35" x2="178" y2="20" stroke="#0f380f" stroke-width="1.5"/>
      <line x1="156" y1="65" x2="152" y2="72" stroke="#0f380f" stroke-width="2"/>
      <line x1="184" y1="65" x2="188" y2="72" stroke="#0f380f" stroke-width="2"/>

      <!-- 畳（たたみ）の床 -->
      <rect x="0" y="110" width="200" height="50" fill="#6b8c08"/>
      <line x1="0" y1="110" x2="200" y2="110" stroke="#0f380f" stroke-width="2"/>
      <!-- 畳の縁（へり） -->
      <line x1="0" y1="135" x2="200" y2="135" stroke="#0f380f" stroke-width="3" stroke-dasharray="8,4"/>
      <line x1="100" y1="110" x2="100" y2="135" stroke="#0f380f" stroke-width="1.5"/>

      <!-- 中央のちゃぶ台（急須と湯呑み） -->
      <ellipse cx="100" cy="125" rx="40" ry="12" fill="#8bac0f" stroke="#0f380f" stroke-width="2"/>
      <line x1="70" y1="133" x2="68" y2="142" stroke="#0f380f" stroke-width="2"/>
      <line x1="130" y1="133" x2="132" y2="142" stroke="#0f380f" stroke-width="2"/>
      <!-- 急須と湯呑み -->
      <rect x="92" y="115" width="8" height="6" rx="1" fill="#0f380f"/>
      <path d="M 100 118 Q 104 117 103 121" fill="none" stroke="#0f380f" stroke-width="1"/>
      <rect x="106" y="117" width="4" height="4" fill="#0f380f"/>
    </svg>

    <!-- 👾 解像度アップしたドット絵オカン -->
    <div id="okan-container" class="okan-pixel pos-tv pose-stand">
      <div id="fart-pixel" class="fart-pixel"></div>
    </div>

    <!-- メッセージ -->
    <div id="dialogue" class="dialogue-box">テレビでも見ようかねぇ</div>
  </div>

  <div class="status">
    <div>機嫌: <span id="mood-bar">❤️❤️🖤🖤🖤</span></div>
    <div>体重: <span id="weight-val">55.0</span> kg</div>
    <div>行動: <span id="state-val">テレビ鑑賞</span></div>
  </div>

  <div class="controls">
    <button onclick="giveSake()">🍶 お酒あげる</button>
    <button onclick="giveSnack()">🥜 おつまみ</button>
    <button onclick="doExercise()">🧹 部屋掃除</button>
    <button onclick="talk()">💬 話しかける</button>
  </div>
</div>

<script>
  const pass = prompt("合言葉を入力してね (初期値: 1234)");
  if(pass === "1234") {
    document.getElementById("game").style.display = "block";
  } else {
    alert("合言葉が違います！");
  }

  let mood = 40;
  let weight = 55.0;
  let isBusy = false;

  const lines = [
    "あんた、ちゃんとご飯食べてるの？",
    "今日スーパーで卵が安かったのよ～",
    "あんたの部屋、ちょっと片付けなさいよ",
    "テレビのチャンネル、そこ変えないでよ"
  ];

  const idleStates = [
    { pos: "pos-tv", pose: "pose-stand", text: "テレビのワイドショーに夢中", state: "テレビ鑑賞" },
    { pos: "pos-chabudai-left", pose: "pose-lay", text: "ちゃぶ台の横でゴロゴロ寝転がっている", state: "ゴロゴロ居眠り" },
    { pos: "pos-center", pose: "pose-stand", text: "畳の上でぼーっとしている", state: "休憩中" }
  ];

  function updateDisplay() {
    let hearts = "";
    let filled = Math.min(5, Math.floor(mood / 20));
    for(let i=0; i<5; i++) { hearts += i < filled ? "❤️" : "🖤"; }
    document.getElementById("mood-bar").innerText = hearts;
    document.getElementById("weight-val").innerText = weight.toFixed(1);
  }

  // 自動行動
  setInterval(() => {
    if (isBusy) return;
    const action = idleStates[Math.floor(Math.random() * idleStates.length)];
    const container = document.getElementById("okan-container");
    container.className = `okan-pixel ${action.pos} ${action.pose}`;
    document.getElementById("dialogue").innerText = action.text;
    document.getElementById("state-val").innerText = action.state;
  }, 4000);

  // ⭐ おならイベント ⭐
  function checkFart() {
    if (Math.random() < 0.4) {
      isBusy = true;
      const container = document.getElementById("okan-container");
      const fart = document.getElementById("fart-pixel");

      container.className = "okan-pixel pos-chabudai-left pose-lay";

      setTimeout(() => {
        fart.className = "fart-pixel fart-active";
        document.getElementById("dialogue").innerText = "……ス〜……プッ💨 あらやだ！";
        document.getElementById("state-val").innerText = "放屁(ごろ寝中)";
      }, 300);

      setTimeout(() => {
        fart.className = "fart-pixel";
        isBusy = false;
      }, 3200);
      return true;
    }
    return false;
  }

  function giveSake() {
    mood = Math.min(100, mood + 15); weight += 0.3;
    isBusy = true;
    const container = document.getElementById("okan-container");
    container.className = "okan-pixel pos-chabudai-right pose-stand";
    document.getElementById("dialogue").innerText = "やだ～、呑んじゃおうかしら♪";
    document.getElementById("state-val").innerText = "晩酌中";
    updateDisplay();
    setTimeout(() => { isBusy = false; }, 3000);
  }

  function giveSnack() {
    mood = Math.min(100, mood + 10); weight += 0.5;
    isBusy = true;
    const container = document.getElementById("okan-container");
    container.className = "okan-pixel pos-chabudai-left pose-lay";
    document.getElementById("dialogue").innerText = "寝っ転がって食べるおせんべいが最高";
    document.getElementById("state-val").innerText = "寝ながら間食";
    updateDisplay();
    setTimeout(() => { isBusy = false; }, 3000);
  }

  function doExercise() {
    mood = Math.max(0, mood - 10); weight = Math.max(40, weight - 0.4);
    isBusy = true;
    const container = document.getElementById("okan-container");
    container.className = "okan-pixel anim-cleaning";
    document.getElementById("dialogue").innerText = "はいはい、掃除すればいいんでしょ！";
    document.getElementById("state-val").innerText = "部屋を掃除中";
    updateDisplay();
    setTimeout(() => {
      container.className = "okan-pixel pos-center pose-stand";
      isBusy = false;
    }, 4000);
  }

  function talk() {
    if(!checkFart()) {
      document.getElementById("dialogue").innerText = lines[Math.floor(Math.random() * lines.length)];
      document.getElementById("state-val").innerText = "会話中";
    }
    updateDisplay();
  }
</script>

</body>
</html>
