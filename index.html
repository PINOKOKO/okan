<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="オカン育成">

<title>オカン育成</title>
<style>
  :root {
    --bg-color: #bce0a8; /* レトロ液晶背景 */
    --pixel-color: #1a1a1a; /* ドット黒 */
    --p-size: 2px; /* 1ピクセルの大きさ */
  }

  body {
    background-color: #1a1a1a;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 本体フレーム */
  .game-container {
    background-color: #e2e0d8;
    border: calc(var(--p-size) * 2) solid #333;
    width: 88vw;
    max-width: 340px;
    padding: 18px;
    text-align: center;
    border-radius: 40px;
    box-shadow: 0 8px 0 #000, inset 0 4px 0 rgba(255,255,255,0.5);
    position: relative;
  }

  /* 液晶画面 */
  .screen {
    background-color: var(--bg-color);
    color: var(--pixel-color);
    border: calc(var(--p-size) * 1.5) solid #2d481e;
    height: 225px;
    margin-bottom: 12px;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
    box-shadow: inset 3px 3px 6px rgba(0,0,0,0.3);
  }

  /* 昭和の居間 背景 (静止画) */
  .room-bg {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 35px;
    border-bottom: var(--p-size) solid var(--pixel-color);
  }

  /* 精巧ドット家具 */
  .furniture {
    position: absolute;
    font-size: 10px;
    font-weight: bold;
  }
  .tv-set { top: 15px; right: 15px; font-size: 30px;}
  .chabudai { bottom: 0; left: 30%; font-size: 50px; opacity: 0.7;}
  .phone { top: 5px; left: 15px; font-size: 24px; }
  .clock { top: 5px; left: 45%; }

  /* -------------------------------------
     完全新設計：全身ドット絵オカン
     (パーツ独立・レイヤー構造)
  ------------------------------------- */
  .okan-container {
    position: absolute;
    transition: all 0.2s steps(4); /* カクカク移動 */
    z-index: 10;
  }

  /* 移動位置 */
  .pos-tv { top: 75px; right: 35px; }
  .pos-chabudai { top: 105px; left: 15px; }
  .pos-center { top: 90px; left: 35%; }

  /* 立ち姿オカン (茶髪パーマ・割烹着) */
  .okan-stand {
    position: relative;
    width: calc(var(--p-size) * 12);
    height: calc(var(--p-size) * 20);
    z-index: 10;
  }
  .okan-stand::after {
    content: ''; position: absolute;
    width: var(--p-size); height: var(--p-size);
    /* box-shadowで全身描画 (茶髪パーマ、ニコニコ顔、割烹着) */
    box-shadow: 
      /* パーマ */
      calc(var(--p-size)*4) calc(var(--p-size)*0) var(--pixel-color), calc(var(--p-size)*5) calc(var(--p-size)*0) var(--pixel-color), calc(var(--p-size)*6) calc(var(--p-size)*0) var(--pixel-color), calc(var(--p-size)*7) calc(var(--p-size)*0) var(--pixel-color),
      calc(var(--p-size)*3) calc(var(--p-size)*1) var(--pixel-color), calc(var(--p-size)*4) calc(var(--p-size)*1) var(--pixel-color), calc(var(--p-size)*7) calc(var(--p-size)*1) var(--pixel-color), calc(var(--p-size)*8) calc(var(--p-size)*1) var(--pixel-color),
      calc(var(--p-size)*2) calc(var(--p-size)*2) var(--pixel-color), calc(var(--p-size)*3) calc(var(--p-size)*2) var(--pixel-color), calc(var(--p-size)*8) calc(var(--p-size)*2) var(--pixel-color), calc(var(--p-size)*9) calc(var(--p-size)*2) var(--pixel-color),
      calc(var(--p-size)*1) calc(var(--p-size)*3) var(--pixel-color), calc(var(--p-size)*2) calc(var(--p-size)*3) var(--pixel-color), calc(var(--p-size)*9) calc(var(--p-size)*3) var(--pixel-color), calc(var(--p-size)*10) calc(var(--p-size)*3) var(--pixel-color),
      /* 顔 */
      calc(var(--p-size)*2) calc(var(--p-size)*4) var(--pixel-color), calc(var(--p-size)*3) calc(var(--p-size)*4) var(--pixel-color), calc(var(--p-size)*8) calc(var(--p-size)*4) var(--pixel-color), calc(var(--p-size)*9) calc(var(--p-size)*4) var(--pixel-color),
      calc(var(--p-size)*4) calc(var(--p-size)*5) var(--pixel-color), calc(var(--p-size)*7) calc(var(--p-size)*5) var(--pixel-color), /* 目 */
      calc(var(--p-size)*3) calc(var(--p-size)*7) var(--pixel-color), calc(var(--p-size)*8) calc(var(--p-size)*7) var(--pixel-color),
      calc(var(--p-size)*4) calc(var(--p-size)*8) var(--pixel-color), calc(var(--p-size)*5) calc(var(--p-size)*8) var(--pixel-color), calc(var(--p-size)*6) calc(var(--p-size)*8) var(--pixel-color), calc(var(--p-size)*7) calc(var(--p-size)*8) var(--pixel-color), /* ニコニコ口 */
      /* 割烹着体 */
      calc(var(--p-size)*3) calc(var(--p-size)*9) var(--pixel-color), calc(var(--p-size)*8) calc(var(--p-size)*9) var(--pixel-color),
      calc(var(--p-size)*2) calc(var(--p-size)*10) var(--pixel-color), calc(var(--p-size)*9) calc(var(--p-size)*10) var(--pixel-color),
      calc(var(--p-size)*1) calc(var(--p-size)*12) var(--pixel-color), calc(var(--p-size)*10) calc(var(--p-size)*12) var(--pixel-color),
      calc(var(--p-size)*1) calc(var(--p-size)*14) var(--pixel-color), calc(var(--p-size)*10) calc(var(--p-size)*14) var(--pixel-color),
      calc(var(--p-size)*2) calc(var(--p-size)*16) var(--pixel-color), calc(var(--p-size)*9) calc(var(--p-size)*16) var(--pixel-color),
      calc(var(--p-size)*3) calc(var(--p-size)*17) var(--pixel-color), calc(var(--p-size)*8) calc(var(--p-size)*17) var(--pixel-color),
      /* 足 */
      calc(var(--p-size)*3) calc(var(--p-size)*18) var(--pixel-color), calc(var(--p-size)*8) calc(var(--p-size)*18) var(--pixel-color),
      calc(var(--p-size)*2) calc(var(--p-size)*19) var(--pixel-color), calc(var(--p-size)*3) calc(var(--p-size)*19) var(--pixel-color), calc(var(--p-size)*8) calc(var(--p-size)*19) var(--pixel-color), calc(var(--p-size)*9) calc(var(--p-size)*19) var(--pixel-color)
    ;
  }

  /* -------------------------------------
     ⭐ 完全解決：こっち向き ごろ寝オカン ⭐
     (首の欠け・頬杖を解消)
  ------------------------------------- */
  .okan-lay {
    position: relative;
    width: calc(var(--p-size) * 18);
    height: calc(var(--p-size) * 14);
    display: none;
  }

  /* 1. ベース：首〜体〜足（割烹着） */
  .okan-lay .lay-body::after {
    content: ''; position: absolute;
    width: var(--p-size); height: var(--p-size);
    /* 首の穴をなくし、立ち姿と同じ配色・シルエットで横たわらせる */
    box-shadow:
      /* 首〜胸 (ここを完全に塗りつぶして浮きをなくす) */
      calc(var(--p-size)*4) calc(var(--p-size)*4) var(--pixel-color), calc(var(--p-size)*5) calc(var(--p-size)*4) var(--pixel-color), calc(var(--p-size)*6) calc(var(--p-size)*4) var(--pixel-color), calc(var(--p-size)*7) calc(var(--p-size)*4) var(--pixel-color),
      calc(var(--p-size)*3) calc(var(--p-size)*5) var(--pixel-color), calc(var(--p-size)*4) calc(var(--p-size)*5) var(--pixel-color), calc(var(--p-size)*7) calc(var(--p-size)*5) var(--pixel-color), calc(var(--p-size)*8) calc(var(--p-size)*5) var(--pixel-color),
      /* 体 (割烹着) */
      calc(var(--p-size)*2) calc(var(--p-size)*6) var(--pixel-color), calc(var(--p-size)*9) calc(var(--p-size)*6) var(--pixel-color),
      calc(var(--p-size)*1) calc(var(--p-size)*7) var(--pixel-color), calc(var(--p-size)*10) calc(var(--p-size)*7) var(--pixel-color),
      calc(var(--p-size)*0) calc(var(--p-size)*9) var(--pixel-color), calc(var(--p-size)*11) calc(var(--p-size)*9) var(--pixel-color),
      calc(var(--p-size)*0) calc(var(--p-size)*11) var(--pixel-color), calc(var(--p-size)*11) calc(var(--p-size)*11) var(--pixel-color),
      calc(var(--p-size)*1) calc(var(--p-size)*12) var(--pixel-color), calc(var(--p-size)*10) calc(var(--p-size)*12) var(--pixel-color),
      /* 足の投げ出し */
      calc(var(--p-size)*11) calc(var(--p-size)*10) var(--pixel-color), calc(var(--p-size)*12) calc(var(--p-size)*11) var(--pixel-color), calc(var(--p-size)*13) calc(var(--p-size)*12) var(--pixel-color),
      calc(var(--p-size)*11) calc(var(--p-size)*12) var(--pixel-color), calc(var(--p-size)*12) calc(var(--p-size)*13) var(--pixel-color), calc(var(--p-size)*13) calc(var(--p-size)*14) var(--pixel-color)
    ;
  }

  /* 2. 上層：顔 (こっち向き) */
  .okan-lay .lay-head::after {
    content: ''; position: absolute;
    width: var(--p-size); height: var(--p-size);
    top: calc(var(--p-size) * -4); /* 首の上に配置 */
    left: calc(var(--p-size) * 1);
    /* 立ち姿の顔・パーマを横向きに再設計 */
    box-shadow:
      /* パーマ髪 */
      calc(var(--p-size)*4) calc(var(--p-size)*0) var(--pixel-color), calc(var(--p-size)*5) calc(var(--p-size)*0) var(--pixel-color), calc(var(--p-size)*6) calc(var(--p-size)*0) var(--pixel-color), calc(var(--p-size)*7) calc(var(--p-size)*0) var(--pixel-color),
      calc(var(--p-size)*2) calc(var(--p-size)*1) var(--pixel-color), calc(var(--p-size)*3) calc(var(--p-size)*1) var(--pixel-color), calc(var(--p-size)*8) calc(var(--p-size)*1) var(--pixel-color), calc(var(--p-size)*9) calc(var(--p-size)*1) var(--pixel-color),
      /* 顔・表情 */
      calc(var(--p-size)*4) calc(var(--p-size)*3) var(--pixel-color), calc(var(--p-size)*7) calc(var(--p-size)*3) var(--pixel-color), /* 目 */
      calc(var(--p-size)*4) calc(var(--p-size)*5) var(--pixel-color), calc(var(--p-size)*5) calc(var(--p-size)*5) var(--pixel-color), calc(var(--p-size)*6) calc(var(--p-size)*5) var(--pixel-color), calc(var(--p-size)*7) calc(var(--p-size)*5) var(--pixel-color) /* ω口 */
    ;
  }

  /* 3. 最上層：腕・手 (顎の下ではなく、耳横・頭の横) */
  .okan-lay .lay-arm::after {
    content: ''; position: absolute;
    width: var(--p-size); height: var(--p-size);
    top: calc(var(--p-size) * -1);
    left: calc(var(--p-size) * -1); /* 頭の横へ */
    /* 顎の下を通らず、頭の横に手を添えて頭を支えるシルエット */
    box-shadow:
      /* 耳横・頭の横に添えた手 */
      calc(var(--p-size)*0) calc(var(--p-size)*1) var(--pixel-color), calc(var(--p-size)*1) calc(var(--p-size)*1) var(--pixel-color),
      calc(var(--p-size)*0) calc(var(--p-size)*2) var(--pixel-color), calc(var(--p-size)*1) calc(var(--p-size)*2) var(--pixel-color),
      calc(var(--p-size)*1) calc(var(--p-size)*3) var(--pixel-color), calc(var(--p-size)*2) calc(var(--p-size)*3) var(--pixel-color),
      /* 床（左下）に伸びる肘・前腕 */
      calc(var(--p-size)*0) calc(var(--p-size)*5) var(--pixel-color), calc(var(--p-size)*1) calc(var(--p-size)*6) var(--pixel-color),
      calc(var(--p-size)*1) calc(var(--p-size)*8) var(--pixel-color), calc(var(--p-size)*2) calc(var(--p-size)*9) var(--pixel-color)
    ;
  }

  /* おならドット (💨の代わりにピクセルでpuffを表現) */
  .fart-puff {
    position: absolute;
    width: calc(var(--p-size) * 3);
    height: calc(var(--p-size) * 3);
    border-radius: 50%;
    background-color: var(--pixel-color);
    transition: all 0.1s;
    opacity: 0;
  }
  .pos-chabudai .fart-puff { /* ごろ寝時の尻の位置 */
    bottom: calc(var(--p-size) * 1);
    left: calc(var(--p-size) * 9);
  }
  .fart-active {
    opacity: 1;
    animation: fart-animation 0.5s steps(2) infinite; /* カクカク点滅 */
  }
  @keyframes fart-animation { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* ドラクエ風掃除アニメーション（カクカク点滅） */
  @keyframes clean-dq {
    0% { left: 10px; top: 110px; opacity: 1; }
    50% { left: 190px; top: 70px; opacity: 0.2; }
    100% { left: 10px; top: 110px; opacity: 1; }
  }
  .anim-cleaning {
    animation: clean-dq 3s infinite steps(6) !important;
  }

  /* ダイアログ（吹き出し）もドット線で精巧に */
  .dialogue-box {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 35px;
    background: var(--bg-color);
    border-top: var(--p-size) solid var(--pixel-color);
    font-size: 11px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .status {
    margin-bottom: 12px;
    text-align: left;
    font-size: 12px;
    background: #222;
    padding: 8px 12px;
    border-radius: 8px;
    border: calc(var(--p-size) * 1) solid #444;
  }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  button {
    background-color: #fff;
    color: #000;
    border: calc(var(--p-size) * 1.5) solid #000;
    padding: 10px;
    font-weight: bold;
    cursor: pointer;
    font-size: 12px;
    border-radius: 10px;
    box-shadow: 0 3px 0 #000;
  }

  button:active {
    box-shadow: 0 0 0 #000;
    transform: translateY(3px);
  }
</style>
</head>
<body>

<div class="game-container" id="game" style="display:none;">
  <div class="screen">
    <!-- 背景 (文字家具からドット家具へ) -->
    <div class="room-bg">
      <div class="furniture tv-set">📺</div>
      <div class="furniture chabudai">🟤</div>
      <div class="furniture clock">⏰</div>
      <div class="furniture phone">☎️</div>
    </div>

    <!-- 完全新設計 全身ドット絵オカン (レイヤー構造) -->
    <div id="okan-container" class="okan-container pos-tv">
      
      <!-- 立ち姿パーツ (全身を1つのshadowで描画) -->
      <div id="okan-stand" class="okan-stand"></div>

      <!-- ごろ寝パーツ (独立・レイヤー構造) -->
      <div id="okan-lay" class="okan-lay">
        <div class="lay-body"></div> <!-- ベース：首、胴体、足 -->
        <div class="lay-head"></div> <!-- 上層：こっち向き顔、パーマ -->
        <div class="lay-arm"></div>  <!-- 最上層：頭の横に添えた腕・手 -->
      </div>

      <!-- おならドット -->
      <div id="fart-puff" class="fart-puff"></div>
    </div>

    <div id="dialogue" class="dialogue-box">テレビでも見ようかねぇ</div>
  </div>

  <div class="status">
    <div>機嫌: <span id="mood-bar">❤️❤️🖤🖤🖤</span></div>
    <div>体重: <span id="weight-val">55.0</span> kg</div>
    <div>行動: <span id="state-val">テレビ鑑賞</span></div>
  </div>

  <div class="controls">
    <button onclick="giveSake()">🍶 お酒あげる</button>
    <button onclick="giveSnack()">🥜 おつまみ</button>
    <button onclick="doExercise()">🧹 部屋掃除</button>
    <button onclick="talk()">💬 話しかける</button>
  </div>
</div>

<script>
  // 合言葉
  const pass = prompt("合言葉を入力してね (初期値: 1234)");
  if(pass === "1234") {
    document.getElementById("game").style.display = "block";
  } else {
    alert("合言葉が違います！");
  }

  let mood = 40;
  let weight = 55.0;
  let isBusy = false;

  const lines = [
    "あんた、ちゃんとご飯食べてるの？",
    "今日スーパーで卵が安かったのよ～",
    "あんたの部屋、ちょっと片付けなさいよ",
    "テレビのチャンネル、そこ変えないでよ"
  ];

  // 行動パターンと配色 (こっち向き、茶髪パーマ)
  const idleStates = [
    { pos: "pos-tv", pose: "stand", text: "テレビのワイドショーに夢中", state: "テレビ鑑賞" },
    { pos: "pos-chabudai", pose: "lay", text: "ちゃぶ台の横でゴロゴロ寝転がっている", state: "ゴロゴロ居眠り" },
    { pos: "pos-center", pose: "stand", text: "部屋の真ん中でぼーっとしている", state: "休憩中" }
  ];

  function updateDisplay() {
    let hearts = "";
    let filled = Math.min(5, Math.floor(mood / 20));
    for(let i=0; i<5; i++) { hearts += i < filled ? "❤️" : "🖤"; }
    document.getElementById("mood-bar").innerText = hearts;
    document.getElementById("weight-val").innerText = weight.toFixed(1);
  }

  function setPose(poseType) {
    const stand = document.getElementById("okan-stand");
    const lay = document.getElementById("okan-lay");
    if(poseType === "stand") {
      stand.style.display = "block";
      lay.style.display = "none";
    } else {
      stand.style.display = "none";
      lay.style.display = "block";
    }
  }

  // 4秒ごとに自動行動
  setInterval(() => {
    if (isBusy) return;
    const action = idleStates[Math.floor(Math.random() * idleStates.length)];
    const container = document.getElementById("okan-container");
    container.className = `okan-container ${action.pos}`;
    setPose(action.pose);
    document.getElementById("dialogue").innerText = action.text;
    document.getElementById("state-val").innerText = action.state;
  }, 4000);

  // ⭐ 完全解決 おならイベント (耳横手添えのまま尻から) ⭐
  function checkFart() {
    if (Math.random() < 0.3) {
      isBusy = true;
      const container = document.getElementById("okan-container");
      const fart = document.getElementById("fart-puff");

      // ちゃぶ台横でゴロゴロさせる (耳横手添えのまま)
      container.className = "okan-container pos-chabudai";
      setPose("lay");

      // 尻からおならドットを出す
      setTimeout(() => {
        fart.className = "fart-puff fart-active";
        document.getElementById("dialogue").innerText = "……プゥッ💨 あらやだ！";
        document.getElementById("state-val").innerText = "放屁 (居眠り中)";
      }, 300);

      setTimeout(() => {
        fart.className = "fart-puff";
        isBusy = false;
      }, 3000);
      return true;
    }
    return false;
  }

  function giveSake() {
    mood = Math.min(100, mood + 15); weight += 0.3;
    isBusy = true;
    const container = document.getElementById("okan-container");
    container.className = "okan-container pos-chabudai";
    setPose("stand");
    document.getElementById("dialogue").innerText = "やだ～、呑んじゃおうかしら♪";
    document.getElementById("state-val").innerText = "晩酌中";
    updateDisplay();
    setTimeout(() => { isBusy = false; }, 3000);
  }

  function giveSnack() {
    mood = Math.min(100, mood + 10); weight += 0.5;
    isBusy = true;
    const container = document.getElementById("okan-container");
    container.className = "okan-container pos-chabudai";
    setPose("lay");
    document.getElementById("dialogue").innerText = "寝っ転がって食べるおせんべいが最高";
    document.getElementById("state-val").innerText = "寝ながら間食";
    updateDisplay();
    setTimeout(() => { isBusy = false; }, 3000);
  }

  function doExercise() {
    mood = Math.max(0, mood - 10); weight = Math.max(40, weight - 0.4);
    isBusy = true;
    const container = document.getElementById("okan-container");
    container.className = "okan-container anim-cleaning pos-center";
    setPose("stand");
    document.getElementById("dialogue").innerText = "はいはい、掃除すればいいんでしょ！";
    document.getElementById("state-val").innerText = "部屋を掃除中";
    updateDisplay();
    setTimeout(() => {
      isBusy = false;
    }, 4000);
  }

  function talk() {
    if(!checkFart()) {
      document.getElementById("dialogue").innerText = lines[Math.floor(Math.random() * lines.length)];
      document.getElementById("state-val").innerText = "会話中";
    }
    updateDisplay();
  }
</script>

</body>
</html>
