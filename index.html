<body>

<div class="game-container" id="game" style="display:none;">
  <div class="screen">
    <!-- 背景とお部屋 (文字家具) -->
    <div class="room-bg">
      <div class="furniture tv-set">📺</div>
      <div class="furniture chabudai"></div> <!-- 円形グラデーション -->
      <div class="furniture clock">⏰</div>
      <div class="furniture phone">☎️</div>
    </div>

    <!-- ✨ 崩れない！精巧全身ドット絵オカン ✨ -->
    <div id="okan-container" class="okan-container pos-tv">
      <!-- 立ち姿 -->
      <div id="okan-stand" class="okan-stand"></div>
      <!-- ごろ寝 (耳横手添え) -->
      <div id="okan-lay" class="okan-lay"></div>
      <!-- おならエフェクト -->
      <div id="fart-effect" class="fart-effect"></div>
    </div>

    <!-- メッセージ -->
    <div id="dialogue" class="dialogue-box">テレビでも見ようかねぇ</div>
  </div>

  <div class="status">
    <div>機嫌: <span id="mood-bar">❤️❤️🖤🖤🖤</span></div>
    <div>体重: <span id="weight-val">55.0</span> kg</div>
    <div>行動: <span id="state-val">テレビ鑑賞</span></div>
  </div>

  <div class="controls">
    <button onclick="giveSake()">🍶 お酒あげる</button>
    <button onclick="giveSnack()">🥜 おつまみ</button>
    <button onclick="doExercise()">🧹 部屋掃除</button>
    <button onclick="talk()">💬 話しかける</button>
  </div>
</div>

<script>
  // 合言葉入力
  const pass = prompt("合言葉を入力してね (初期値: 1234)");
  if(pass === "1234") {
    document.getElementById("game").style.display = "block";
  } else {
    alert("合言葉が違います！");
  }

  let mood = 40;
  let weight = 55.0;
  let isBusy = false;

  const lines = [
    "あんた、ちゃんとご飯食べてるの？",
    "今日スーパーで卵が安かったのよ～",
    "あんたの部屋、ちょっと片付けなさいよ",
    "テレビのチャンネル、そこ変えないでよ"
  ];

  // 行動パターンと配色 (風貌固定、茶髪パーマ)
  const idleStates = [
    { pos: "pos-tv", pose: "stand", text: "テレビのワイドショーに夢中", state: "テレビ鑑賞" },
    { pos: "pos-chabudai", pose: "lay", text: "ちゃぶ台の横でゴロゴロ寝転がっている", state: "ゴロゴロ居眠り" },
    { pos: "pos-center", pose: "stand", text: "部屋の真ん中でぼーっとしている", state: "休憩中" }
  ];

  function setPose(poseType) {
    const stand = document.getElementById("okan-stand");
    const lay = document.getElementById("okan-lay");
    if(poseType === "stand") {
      stand.style.display = "block";
      lay.style.display = "none";
    } else {
      stand.style.display = "none";
      lay.style.display = "block";
    }
  }

  function updateDisplay() {
    let hearts = "";
    let filled = Math.min(5, Math.floor(mood / 20));
    for(let i=0; i<5; i++) { hearts += i < filled ? "❤️" : "🖤"; }
    document.getElementById("mood-bar").innerText = hearts;
    document.getElementById("weight-val").innerText = weight.toFixed(1);
  }

  // 4秒ごとに自動行動
  setInterval(() => {
    if (isBusy) return;
    const action = idleStates[Math.floor(Math.random() * idleStates.length)];
    const container = document.getElementById("okan-container");
    container.className = `okan-container ${action.pos}`;
    setPose(action.pose);
    document.getElementById("dialogue").innerText = action.text;
    document.getElementById("state-val").innerText = action.state;
  }, 4000);

  // おならイベント (耳横手添えのまま尻から点滅エフェクト)
  function checkFart() {
    if (Math.random() < 0.3) {
      isBusy = true;
      const container = document.getElementById("okan-container");
      const fart = document.getElementById("fart-effect");

      // ちゃぶ台横でゴロゴロさせる (耳横手添えポーズ)
      container.className = "okan-container pos-chabudai";
      setPose("lay");

      // おならエフェクト点滅
      setTimeout(() => {
        fart.className = "fart-effect fart-active";
        document.getElementById("dialogue").innerText = "……プゥッ💨 あらやだ！";
        document.getElementById("state-val").innerText = "放屁 (居眠り中)";
      }, 300);

      setTimeout(() => {
        fart.className = "fart-effect";
        isBusy = false;
      }, 3000);
      return true;
    }
    return false;
  }

  function giveSake() {
    mood = Math.min(100, mood + 15); weight += 0.3;
    isBusy = true;
    const container = document.getElementById("okan-container");
    container.className = "okan-container pos-chabudai";
    setPose("stand");
    document.getElementById("dialogue").innerText = "やだ～、呑んじゃおうかしら♪";
    document.getElementById("state-val").innerText = "晩酌中";
    updateDisplay();
    setTimeout(() => { isBusy = false; }, 3000);
  }

  function giveSnack() {
    mood = Math.min(100, mood + 10); weight += 0.5;
    isBusy = true;
    const container = document.getElementById("okan-container");
    container.className = "okan-container pos-chabudai";
    setPose("lay");
    document.getElementById("dialogue").innerText = "寝っ転がって食べるおせんべいが最高";
    document.getElementById("state-val").innerText = "寝ながら間食";
    updateDisplay();
    setTimeout(() => { isBusy = false; }, 3000);
  }

  function doExercise() {
    mood = Math.max(0, mood - 10); weight = Math.max(40, weight - 0.4);
    isBusy = true;
    const container = document.getElementById("okan-container");
    container.className = "okan-container anim-cleaning pos-center";
    setPose("stand");
    document.getElementById("dialogue").innerText = "はいはい、掃除すればいいんでしょ！";
    document.getElementById("state-val").innerText = "部屋を掃除中";
    updateDisplay();
    setTimeout(() => {
      isBusy = false;
    }, 4000);
  }

  function talk() {
    if(!checkFart()) {
      document.getElementById("dialogue").innerText = lines[Math.floor(Math.random() * lines.length)];
      document.getElementById("state-val").innerText = "会話中";
    }
    updateDisplay();
  }
</script>

</body>
</html>
