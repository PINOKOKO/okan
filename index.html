<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>オカン育成</title>
<style>
  :root {
    --bg-color: #bce0a8;
    --pixel-color: #1a1a1a;
    --hair-color: #795548;
    --skin-color: #ffdfc4;
    --obi-color: #fbc02d;
    --p-size: 2px; /* 1ピクセルの大きさ */
  }

  body {
    background-color: #1a1a1a;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 本体フレーム */
  .game-container {
    background-color: #e2e0d8;
    border: 4px solid #333;
    width: 88vw;
    max-width: 340px;
    padding: 18px;
    text-align: center;
    border-radius: 40px;
    box-shadow: 0 8px 0 #000, inset 0 4px 0 rgba(255,255,255,0.5);
    position: relative;
  }

  /* 液晶画面枠 */
  .screen {
    background-color: var(--bg-color);
    color: var(--pixel-color);
    border: 3px solid #2d481e;
    height: 225px;
    margin-bottom: 12px;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
    box-shadow: inset 3px 3px 6px rgba(0,0,0,0.3);
  }

  /* 昭和の居間 背景 (ドット家具付き) */
  .room-svg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 195px;
    opacity: 0.85;
  }

  /* --- キャラ配置エリア --- */
  .okan-container {
    position: absolute;
    width: calc(var(--p-size) * 16);
    height: calc(var(--p-size) * 20);
    transition: all 0.2s steps(4);
    z-index: 10;
  }

  /* 位置設定 */
  .pos-tv { top: 50px; right: 5px; }
  .pos-chabudai-left { top: 85px; left: 0px; }
  .pos-chabudai-right { top: 85px; right: 5px; }
  .pos-center { top: 60px; left: 32%; }

  /* -------------------------------------
     ✨ 精巧1マス打ちドット絵オカン ✨
     (絶対に崩れません)
  ------------------------------------- */

  /* 1. 立ち姿オカン (ふわふわ茶髪パーマ・にっこり口) */
  .okan-stand {
    position: relative;
    width: 100%; height: 100%;
  }
  .okan-stand::after {
    content: ''; position: absolute;
    width: var(--p-size); height: var(--p-size);
    /* 立ち姿：茶髪パーマ、ニコニコ顔、割烹着、黄色帯 */
    box-shadow: 
      /* パーマ */
      calc(var(--p-size)*4) 0 var(--hair-color), calc(var(--p-size)*5) 0 var(--hair-color), calc(var(--p-size)*6) 0 var(--hair-color), calc(var(--p-size)*7) 0 var(--hair-color),
      calc(var(--p-size)*3) calc(var(--p-size)*1) var(--hair-color), calc(var(--p-size)*4) calc(var(--p-size)*1) var(--hair-color), calc(var(--p-size)*7) calc(var(--p-size)*1) var(--hair-color), calc(var(--p-size)*8) calc(var(--p-size)*1) var(--hair-color),
      calc(var(--p-size)*2) calc(var(--p-size)*2) var(--hair-color), calc(var(--p-size)*9) calc(var(--p-size)*2) var(--hair-color),
      calc(var(--p-size)*1) calc(var(--p-size)*3) var(--hair-color), calc(var(--p-size)*10) calc(var(--p-size)*3) var(--hair-color),
      /* 顔 */
      calc(var(--p-size)*2) calc(var(--p-size)*4) var(--skin-color), calc(var(--p-size)*3) calc(var(--p-size)*4) var(--pixel-color), calc(var(--p-size)*8) calc(var(--p-size)*4) var(--pixel-color), calc(var(--p-size)*9) calc(var(--p-size)*4) var(--skin-color),
      calc(var(--p-size)*2) calc(var(--p-size)*5) var(--skin-color), calc(var(--p-size)*3) calc(var(--p-size)*5) var(--skin-color), calc(var(--p-size)*8) calc(var(--p-size)*5) var(--skin-color), calc(var(--p-size)*9) calc(var(--p-size)*5) var(--skin-color),
      calc(var(--p-size)*2) calc(var(--p-size)*6) var(--skin-color), calc(var(--p-size)*3) calc(var(--p-size)*6) var(--skin-color), calc(var(--p-size)*4) calc(var(--p-size)*6) var(--pixel-color), calc(var(--p-size)*7) calc(var(--p-size)*6) var(--pixel-color), calc(var(--p-size)*8) calc(var(--p-size)*6) var(--skin-color), calc(var(--p-size)*9) calc(var(--p-size)*6) var(--skin-color), /* 目 */
      calc(var(--p-size)*2) calc(var(--p-size)*7) var(--skin-color), calc(var(--p-size)*3) calc(var(--p-size)*7) var(--skin-color), calc(var(--p-size)*8) calc(var(--p-size)*7) var(--skin-color), calc(var(--p-size)*9) calc(var(--p-size)*7) var(--skin-color),
      calc(var(--p-size)*4) calc(var(--p-size)*8) var(--pixel-color), calc(var(--p-size)*5) calc(var(--p-size)*8) var(--pixel-color), calc(var(--p-size)*6) calc(var(--p-size)*8) var(--pixel-color), calc(var(--p-size)*7) calc(var(--p-size)*8) var(--pixel-color), /* にっこり口 */
      calc(var(--p-size)*4) calc(var(--p-size)*9) var(--skin-color), calc(var(--p-size)*5) calc(var(--p-size)*9) var(--skin-color), calc(var(--p-size)*6) calc(var(--p-size)*9) var(--skin-color), calc(var(--p-size)*7) calc(var(--p-size)*9) var(--skin-color),
      /* 割烹着体 */
      calc(var(--p-size)*1) calc(var(--p-size)*10) #fff, calc(var(--p-size)*2) calc(var(--p-size)*10) #fff, calc(var(--p-size)*9) calc(var(--p-size)*10) #fff, calc(var(--p-size)*10) calc(var(--p-size)*10) #fff,
      0 calc(var(--p-size)*11) #fff, calc(var(--p-size)*11) calc(var(--p-size)*11) #fff,
      0 calc(var(--p-size)*12) #fff, calc(var(--p-size)*1) calc(var(--p-size)*12) var(--obi-color), calc(var(--p-size)*10) calc(var(--p-size)*12) var(--obi-color), calc(var(--p-size)*11) calc(var(--p-size)*12) #fff,
      0 calc(var(--p-size)*13) #fff, calc(var(--p-size)*11) calc(var(--p-size)*13) #fff,
      calc(var(--p-size)*1) calc(var(--p-size)*15) #fff, calc(var(--p-size)*10) calc(var(--p-size)*15) #fff,
      calc(var(--p-size)*2) calc(var(--p-size)*17) #fff, calc(var(--p-size)*9) calc(var(--p-size)*17) #fff,
      /* 足 */
      calc(var(--p-size)*2) calc(var(--p-size)*18) var(--skin-color), calc(var(--p-size)*9) calc(var(--p-size)*18) var(--skin-color),
      calc(var(--p-size)*1) calc(var(--p-size)*19) var(--pixel-color), calc(var(--p-size)*2) calc(var(--p-size)*19) var(--pixel-color), calc(var(--p-size)*9) calc(var(--p-size)*19) var(--pixel-color), calc(var(--p-size)*10) calc(var(--p-size)*19) var(--pixel-color)
    ;
  }

  /* -------------------------------------
     ⭐ 完璧解決：ごろ寝オカン ⭐
     (風貌固定・耳横手添え・巨大化なし)
  ------------------------------------- */
  .okan-lay {
    position: relative;
    width: 100%; height: 100%;
    display: none;
  }
  .okan-lay::after {
    content: ''; position: absolute;
    width: var(--p-size); height: var(--p-size);
    top: calc(var(--p-size) * 4); /* 頭を下に下げる */
    /* ごろ寝：こっち向き顔、パーマ、耳横の手、投げ出した足 (崩れ無し) */
    box-shadow:
      /* パーマ (立ち姿のモコモコを寝かせた配置) */
      calc(var(--p-size)*0) calc(var(--p-size)*3) var(--hair-color), calc(var(--p-size)*1) calc(var(--p-size)*3) var(--hair-color), calc(var(--p-size)*2) calc(var(--p-size)*3) var(--hair-color), calc(var(--p-size)*3) calc(var(--p-size)*3) var(--hair-color),
      calc(var(--p-size)*1) calc(var(--p-size)*4) var(--hair-color), calc(var(--p-size)*2) calc(var(--p-size)*4) var(--hair-color), calc(var(--p-size)*3) calc(var(--p-size)*4) var(--hair-color), calc(var(--p-size)*4) calc(var(--p-size)*4) var(--hair-color),
      calc(var(--p-size)*2) calc(var(--p-size)*5) var(--hair-color), calc(var(--p-size)*11) calc(var(--p-size)*5) var(--hair-color),
      calc(var(--p-size)*3) calc(var(--p-size)*6) var(--hair-color), calc(var(--p-size)*12) calc(var(--p-size)*6) var(--hair-color),
      /* 顔 (立ち姿と同じにっこり表情) */
      calc(var(--p-size)*4) calc(var(--p-size)*7) var(--skin-color), calc(var(--p-size)*5) calc(var(--p-size)*7) var(--pixel-color), calc(var(--p-size)*8) calc(var(--p-size)*7) var(--pixel-color), calc(var(--p-size)*9) calc(var(--p-size)*7) var(--skin-color), /* 目 */
      calc(var(--p-size)*4) calc(var(--p-size)*8) var(--skin-color), calc(var(--p-size)*9) calc(var(--p-size)*8) var(--skin-color),
      calc(var(--p-size)*5) calc(var(--p-size)*9) var(--pixel-color), calc(var(--p-size)*6) calc(var(--p-size)*9) var(--pixel-color), calc(var(--p-size)*7) calc(var(--p-size)*9) var(--pixel-color), calc(var(--p-size)*8) calc(var(--p-size)*9) var(--pixel-color), /* にっこり口 */
      /* 耳横に添えた手 (頬杖解消) */
      calc(var(--p-size)*0) calc(var(--p-size)*7) var(--skin-color), calc(var(--p-size)*1) calc(var(--p-size)*7) var(--skin-color),
      calc(var(--p-size)*0) calc(var(--p-size)*8) var(--skin-color), calc(var(--p-size)*1) calc(var(--p-size)*8) var(--skin-color),
      /* 割烹着体 (横たわってる、配色統一) */
      calc(var(--p-size)*10) calc(var(--p-size)*7) #fff, calc(var(--p-size)*11) calc(var(--p-size)*7) #fff, calc(var(--p-size)*12) calc(var(--p-size)*7) #fff,
      calc(var(--p-size)*4) calc(var(--p-size)*10) #fff, calc(var(--p-size)*5) calc(var(--p-size)*10) #fff, calc(var(--p-size)*6) calc(var(--p-size)*10) #fff, calc(var(--p-size)*7) calc(var(--p-size)*10) #fff, calc(var(--p-size)*8) calc(var(--p-size)*10) #fff, calc(var(--p-size)*9) calc(var(--p-size)*10) #fff,
      calc(var(--p-size)*5) calc(var(--p-size)*11) #fff, calc(var(--p-size)*6) calc(var(--p-size)*11) var(--obi-color), calc(var(--p-size)*7) calc(var(--p-size)*11) var(--obi-color), calc(var(--p-size)*10) calc(var(--p-size)*11) #fff,
      calc(var(--p-size)*6) calc(var(--p-size)*12) #fff, calc(var(--p-size)*9) calc(var(--p-size)*12) #fff,
      /* 投げ出した素足 (土踏まずドット付き) */
      calc(var(--p-size)*10) calc(var(--p-size)*12) var(--skin-color), calc(var(--p-size)*11) calc(var(--p-size)*12) var(--skin-color), calc(var(--p-size)*12) calc(var(--p-size)*12) var(--skin-color), calc(var(--p-size)*13) calc(var(--p-size)*12) var(--skin-color),
      calc(var(--p-size)*13) calc(var(--p-size)*11) var(--pixel-color), calc(var(--p-size)*14) calc(var(--p-size)*11) var(--pixel-color), calc(var(--p-size)*13) calc(var(--p-size)*13) var(--pixel-color), calc(var(--p-size)*14) calc(var(--p-size)*13) var(--pixel-color)
    ;
  }

  /* おならドット */
  .fart-puff {
    position: absolute;
    width: calc(var(--p-size) * 3);
    height: calc(var(--p-size) * 3);
    border-radius: 50%;
    background-color: var(--pixel-color);
    transition: all 0.1s;
    opacity: 0;
  }
  .pos-chabudai-left .fart-puff { /* ごろ寝時の尻 */
    bottom: calc(var(--p-size) * 3);
    left: calc(var(--p-size) * 11);
  }
  .fart-active {
    opacity: 1;
    animation: fart-animation 0.5s steps(2) infinite; /* 点滅 */
  }
  @keyframes fart-animation { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* 掃除アニメーション (DQ風カクカク移動) */
  @keyframes clean-dq {
    0% { left: 5px; top: 85px; transform: scaleX(1); }
    50% { left: 175px; top: 60px; transform: scaleX(-1); }
    100% { left: 5px; top: 85px; transform: scaleX(1); }
  }
  .anim-cleaning {
    animation: clean-dq 3s infinite steps(6) !important;
  }

  .dialogue-box {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 35px;
    background: var(--bg-color);
    border-top: 2px solid #2d481e;
    font-size: 11px; font-weight: bold;
    color: #1a330e;
    display: flex; align-items: center; justify-content: center;
    padding: 0 5px;
  }

  .status {
    margin-bottom: 12px; text-align: left; font-size: 12px;
    background: #222; padding: 8px 12px;
    border-radius: 8px; border: 2px solid #444;
  }

  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  button {
    background-color: #fff; color: #000; border: 3px solid #000;
    padding: 10px; font-weight: bold; cursor: pointer;
    font-size: 12px; border-radius: 10px;
    box-shadow: 0 3px 0 #000;
  }
  button:active { box-shadow: 0 0 0 #000; transform: translateY(3px); }
</style>
</head>
<body>

<div class="game-container" id="game" style="display:none;">
  <div class="screen">
    
    <!-- 和室 背景 (ドット絵📺付き) -->
    <svg class="room-svg" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="200" height="110" fill="#a3c98f"/>
      <line x1="0" y1="30" x2="200" y2="30" stroke="#2d481e" stroke-width="1" opacity="0.3"/>
      <line x1="0" y1="70" x2="200" y2="70" stroke="#2d481e" stroke-width="1" opacity="0.3"/>
      
      <!-- テレビ (右奥) -->
      <rect x="150" y="35" width="40" height="30" rx="3" fill="#3a5a28" stroke="#2d481e" stroke-width="2"/>
      <rect x="154" y="39" width="24" height="22" rx="2" fill="#88af74"/>
      <circle cx="183" cy="44" r="2" fill="#2d481e"/>
      <circle cx="183" cy="52" r="2" fill="#2d481e"/>

      <!-- 床 -->
      <rect x="0" y="110" width="200" height="50" fill="#88af74"/>
      <line x1="0" y1="110" x2="200" y2="110" stroke="#2d481e" stroke-width="2"/>
      <line x1="0" y1="135" x2="200" y2="135" stroke="#2d481e" stroke-width="3" stroke-dasharray="8,4"/>
      <line x1="100" y1="110" x2="100" y2="135" stroke="#2d481e" stroke-width="1.5"/>

      <!-- ちゃぶ台 (中央・影) -->
      <ellipse cx="100" cy="125" rx="40" ry="12" fill="#795548" opacity="0.7"/>

      <!-- 額縁 (富士山) -->
      <rect x="90" y="10" width="20" height="30" fill="none" stroke="#2d481e" stroke-width="1.5"/>
      <path d="M92,30 l4,-6 l2,2 l4,-4 l2,4 z" fill="#2d481e" opacity="0.15"/>
    </svg>

    <!-- ✨ 崩れない！はみ出さない！完全1マス打ちドット絵オカン ✨ -->
    <div id="okan-container" class="okan-container pos-tv">
      
      <!-- 1. 立ち姿オカン (ふわふわ茶髪パーマ・にっこり口) -->
      <div id="okan-stand" class="okan-stand"></div>

      <!-- 2. ごろ寝オカン (風貌固定・耳横手添え・崩れ無し) -->
      <div id="okan-lay" class="okan-lay"></div>

      <!-- おならドット -->
      <div id="fart-puff" class="fart-puff"></div>
    </div>

    <!-- メッセージ -->
    <div id="dialogue" class="dialogue-box">テレビでも見ようかねぇ</div>
  </div>

  <div class="status">
    <div>機嫌: <span id="mood-bar">❤️❤️🖤🖤🖤</span></div>
    <div>体重: <span id="weight-val">55.0</span> kg</div>
    <div>行動: <span id="state-val">テレビ鑑賞</span></div>
  </div>

  <div class="controls">
    <button onclick="giveSake()">🍶 お酒あげる</button>
    <button onclick="giveSnack()">🥜 おつまみ</button>
    <button onclick="doExercise()">🧹 部屋掃除</button>
    <button onclick="talk()">💬 話しかける</button>
  </div>
</div>

<script>
  // 合言葉
  const pass = prompt("合言葉を入力してね (初期値: 1234)");
  if(pass === "1234") {
    document.getElementById("game").style.display = "block";
  } else {
    alert("合言葉が違います！");
  }

  let mood = 40;
  let weight = 55.0;
  let isBusy = false;

  const lines = [
    "あんた、ちゃんとご飯食べてるの？",
    "今日スーパーで卵が安かったのよ～",
    "あんたの部屋、ちょっと片付けなさいよ",
    "テレビのチャンネル、そこ変えないでよ"
  ];

  // 行動パターンと配色 (風貌固定、茶髪パーマ)
  const idleStates = [
    { pos: "pos-tv", pose: "stand", text: "テレビのワイドショーに夢中", state: "テレビ鑑賞" },
    { pos: "pos-chabudai-left", pose: "lay", text: "ちゃぶ台の横でゴロゴロ寝転がっている", state: "ゴロゴロ居眠り" },
    { pos: "pos-center", pose: "stand", text: "畳の上でぼーっとしている", state: "休憩中" }
  ];

  function setPose(poseType) {
    const standSvg = document.getElementById("okan-stand");
    const laySvg = document.getElementById("okan-lay");
    if(poseType === "stand") {
      standSvg.style.display = "block";
      laySvg.style.display = "none";
    } else {
      standSvg.style.display = "none";
      laySvg.style.display = "block";
    }
  }

  function updateDisplay() {
    let hearts = "";
    let filled = Math.min(5, Math.floor(mood / 20));
    for(let i=0; i<5; i++) { hearts += i < filled ? "❤️" : "🖤"; }
    document.getElementById("mood-bar").innerText = hearts;
    document.getElementById("weight-val").innerText = weight.toFixed(1);
  }

  // 自動行動
  setInterval(() => {
    if (isBusy) return;
    const action = idleStates[Math.floor(Math.random() * idleStates.length)];
    const container = document.getElementById("okan-container");
    container.className = `okan-container ${action.pos}`;
    setPose(action.pose);
    document.getElementById("dialogue").innerText = action.text;
    document.getElementById("state-val").innerText = action.state;
  }, 4000);

  // おならイベント
  function checkFart() {
    if (Math.random() < 0.4) {
      isBusy = true;
      const container = document.getElementById("okan-container");
      const fart = document.getElementById("fart-puff");

      container.className = "okan-container pos-chabudai-left";
      setPose("lay");

      setTimeout(() => {
        fart.className = "fart-puff fart-active";
        document.getElementById("dialogue").innerText = "……ス〜……プッ💨 あらやだ！";
        document.getElementById("state-val").innerText = "放屁(ごろ寝中)";
      }, 300);

      setTimeout(() => {
        fart.className = "fart-puff";
        isBusy = false;
      }, 3200);
      return true;
    }
    return false;
  }

  function giveSake() {
    mood = Math.min(100, mood + 15); weight += 0.3;
    isBusy = true;
    const container = document.getElementById("okan-container");
    container.className = "okan-container pos-chabudai-right";
    setPose("stand");
    document.getElementById("dialogue").innerText = "やだ～、呑んじゃおうかしら♪";
    document.getElementById("state-val").innerText = "晩酌中";
    updateDisplay();
    setTimeout(() => { isBusy = false; }, 3000);
  }

  function giveSnack() {
    mood = Math.min(100, mood + 10); weight += 0.5;
    isBusy = true;
    const container = document.getElementById("okan-container");
    container.className = "okan-container pos-chabudai-left";
    setPose("lay");
    document.getElementById("dialogue").innerText = "寝っ転がって食べるおせんべいが最高";
    document.getElementById("state-val").innerText = "寝ながら間食";
    updateDisplay();
    setTimeout(() => { isBusy = false; }, 3000);
  }

  function doExercise() {
    mood = Math.max(0, mood - 10); weight = Math.max(40, weight - 0.4);
    isBusy = true;
    const container = document.getElementById("okan-container");
    container.className = "okan-container anim-cleaning pos-center";
    setPose("stand");
    document.getElementById("dialogue").innerText = "はいはい、掃除すればいいんでしょ！";
    document.getElementById("state-val").innerText = "部屋を掃除中";
    updateDisplay();
    setTimeout(() => {
      isBusy = false;
    }, 4000);
  }

  function talk() {
    if(!checkFart()) {
      document.getElementById("dialogue").innerText = lines[Math.floor(Math.random() * lines.length)];
      document.getElementById("state-val").innerText = "会話中";
    }
    updateDisplay();
  }
