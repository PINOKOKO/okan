<title>オカン育成</title>
<style>

    border-radius: 8px;

    overflow: hidden;
    box-shadow: inset 3px 3px 6px rgba(0,0,0,0.3);

      calc(var(--p-size)*0) calc(var(--p-size)*2) var(--pixel-color), calc(var(--p-size)*9) calc(var(--p-size)*2) var(--pixel-color),

      /* 顔 (ニッコリ目とω口) */

      calc(var(--p-size)*7) calc(var(--p-size)*8) var(--pixel-color), calc(var(--p-size)*9) calc(var(--p-size)*8) var(--pixel-color),

      /* 足 */
      calc(var(--p-size)*4) calc(var(--p-size)*18) var(--pixel-color), calc(var(--p-size)*5) calc(var(--p-size)*18) var(--pixel-color), calc(var(--p-size)*11) calc(var(--p-size)*18) var(--pixel-color), calc(var(--p-size)*12) calc(var(--p-size)*18) var(--pixel-color)

      calc(var(--p-size)*1) calc(var(--p-size)*10) var(--pixel-color), calc(var(--p-size)*2) calc(var(--p-size)*11) var(--pixel-color), calc(var(--p-size)*3) calc(var(--p-size)*12) var(--pixel-color),
      /* パーマ頭 (横向き) */

      calc(var(--p-size)*1) calc(var(--p-size)*6) var(--pixel-color), calc(var(--p-size)*1) calc(var(--p-size)*7) var(--pixel-color), calc(var(--p-size)*1) calc(var(--p-size)*8) var(--pixel-color),
      /* 顔 (目を閉じてリラックス) */
      calc(var(--p-size)*4) calc(var(--p-size)*7) var(--pixel-color), calc(var(--p-size)*5) calc(var(--p-size)*7) var(--pixel-color), /* 閉じた目 */
      calc(var(--p-size)*5) calc(var(--p-size)*9) var(--pixel-color), /* アゴ */

      calc(var(--p-size)*6) calc(var(--p-size)*8) var(--pixel-color), calc(var(--p-size)*7) calc(var(--p-size)*8) var(--pixel-color),
      calc(var(--p-size)*8) calc(var(--p-size)*9) var(--pixel-color), calc(var(--p-size)*9) calc(var(--p-size)*9) var(--pixel-color), calc(var(--p-size)*10) calc(var(--p-size)*9) var(--pixel-color), calc(var(--p-size)*11) calc(var(--p-size)*9) var(--pixel-color), calc(var(--p-size)*12) calc(var(--p-size)*9) var(--pixel-color),
      calc(var(--p-size)*6) calc(var(--p-size)*12) var(--pixel-color), calc(var(--p-size)*7) calc(var(--p-size)*12) var(--pixel-color), calc(var(--p-size)*8) calc(var(--p-size)*12) var(--pixel-color), calc(var(--p-size)*9) calc(var(--p-size)*12) var(--pixel-color), calc(var(--p-size)*10) calc(var(--p-size)*12) var(--pixel-color), calc(var(--p-size)*11) calc(var(--p-size)*12) var(--pixel-color), calc(var(--p-size)*12) calc(var(--p-size)*12) var(--pixel-color),
      /* 曲げた足 */
      calc(var(--p-size)*13) calc(var(--p-size)*10) var(--pixel-color), calc(var(--p-size)*14) calc(var(--p-size)*9) var(--pixel-color), calc(var(--p-size)*15) calc(var(--p-size)*10) var(--pixel-color),
      calc(var(--p-size)*13) calc(var(--p-size)*11) var(--pixel-color), calc(var(--p-size)*14) calc(var(--p-size)*12) var(--pixel-color)
    ;
  }

  /* キャラの位置 */
  .pos-tv { top: 60px; right: 35px; }
  .pos-chabudai-left { top: 100px; left: 15px; }
  .pos-chabudai-right { top: 100px; right: 15px; }
  .pos-center { top: 65px; left: 20px; }

  /* ⭐ 改良版：おなら吹き出しドット絵アニメーション ⭐ */
  .fart-pixel {
    position: absolute;
    width: var(--p-size); height: var(--p-size);
    background: transparent;
    opacity: 0;
    z-index: 15;
  }
  
  /* ごろ寝時のお尻の位置（右側）に合わせる */
  .pos-chabudai-left .fart-pixel, .pos-chabudai-right .fart-pixel {
    top: calc(var(--p-size) * 8);
    right: calc(var(--p-size) * -4);
  }

  .fart-active {
    animation: fart-animation 1s steps(4) infinite;
  }

  @keyframes fart-animation {
    0% {
      opacity: 1;
      box-shadow: calc(var(--p-size)*0) calc(var(--p-size)*0) var(--pixel-color);

<body>

<div class="game-container" id="game" style="display:none;">
  <div class="screen">
    <!-- 昭和の居間 背景 -->
    <div class="room-bg">
      <div class="furniture kakejiku"></div>
      <div class="furniture tv-set"></div>
      <div class="furniture phone"></div>
      <div class="furniture ちゃぶ台"></div>
      <div class="tatami-floor"></div>
    </div>

    <!-- オカン -->
    <div id="okan-container" class="okan-pixel pos-tv pose-stand">
      <div id="fart-pixel" class="fart-pixel"></div>
    </div>

    <!-- メッセージ -->
    <div id="dialogue" class="dialogue-box">テレビでも見ようかねぇ</div>
  </div>

  <div class="status">
    <div>機嫌: <span id="mood-bar">❤️❤️🖤🖤🖤</span></div>
    <div>体重: <span id="weight-val">55.0</span> kg</div>
    <div>行動: <span id="state-val">テレビ鑑賞</span></div>
  </div>

  <div class="controls">
    <button onclick="giveSake()">🍶 お酒あげる</button>
    <button onclick="giveSnack()">🥜 おつまみ</button>
    <button onclick="doExercise()">🧹 部屋掃除</button>
    <button onclick="talk()">💬 話しかける</button>
  </div>
</div>

<script>
  const pass = prompt("合言葉を入力してね (初期値: 1234)");
  if(pass === "1234") {
    document.getElementById("game").style.display = "block";
  } else {
    alert("合言葉が違います！");
  }

  let mood = 40;
  let weight = 55.0;
  let isBusy = false;

  const lines = [
    "あんた、ちゃんとご飯食べてるの？",
    "今日スーパーで卵が安かったのよ～",
    "あんたの部屋、ちょっと片付けなさいよ",
    "テレビのチャンネル、そこ変えないでよ"
  ];

  const idleStates = [
    { pos: "pos-tv", pose: "pose-stand", text: "テレビのワイドショーに夢中", state: "テレビ鑑賞" },
    { pos: "pos-chabudai-left", pose: "pose-lay", text: "ちゃぶ台の横でゴロゴロ寝転がっている", state: "ゴロゴロ居眠り" },
    { pos: "pos-center", pose: "pose-stand", text: "黒電話の横でぼーっとしている", state: "長電話待ち" }
  ];

  function updateDisplay() {
    let hearts = "";
    let filled = Math.min(5, Math.floor(mood / 20));
    for(let i=0; i<5; i++) { hearts += i < filled ? "❤️" : "🖤"; }
    document.getElementById("mood-bar").innerText = hearts;
    document.getElementById("weight-val").innerText = weight.toFixed(1);
  }

  // 自動行動
  setInterval(() => {
    if (isBusy) return;
    const action = idleStates[Math.floor(Math.random() * idleStates.length)];
    const container = document.getElementById("okan-container");
    container.className = `okan-pixel ${action.pos} ${action.pose}`;
    document.getElementById("dialogue").innerText = action.text;
    document.getElementById("state-val").innerText = action.state;
  }, 4000);

  // ⭐ おならイベント ⭐
  function checkFart() {
    if (Math.random() < 0.4) {
      isBusy = true;
      const container = document.getElementById("okan-container");
      const fart = document.getElementById("fart-pixel");

      // ごろ寝ポーズに移行
      container.className = "okan-pixel pos-chabudai-left pose-lay";

      setTimeout(() => {
        fart.className = "fart-pixel fart-active";
        document.getElementById("dialogue").innerText = "……ス〜……プッ💨 あらやだ！";
        document.getElementById("state-val").innerText = "放屁(ごろ寝中)";
      }, 400);

      setTimeout(() => {
        fart.className = "fart-pixel";
        isBusy = false;
      }, 3200);
      return true;
    }
    return false;
  }

  function giveSake() {
    mood = Math.min(100, mood + 15); weight += 0.3;
    isBusy = true;
    const container = document.getElementById("okan-container");
    container.className = "okan-pixel pos-chabudai-right pose-stand";
    document.getElementById("dialogue").innerText = "やだ～、呑んじゃおうかしら♪";
    document.getElementById("state-val").innerText = "晩酌中";
    updateDisplay();
    setTimeout(() => { isBusy = false; }, 3000);
  }

  function giveSnack() {
    mood = Math.min(100, mood + 10); weight += 0.5;
    isBusy = true;
    const container = document.getElementById("okan-container");
    container.className = "okan-pixel pos-chabudai-left pose-lay";
    document.getElementById("dialogue").innerText = "寝っ転がって食べるおせんべいが最高";
    document.getElementById("state-val").innerText = "寝ながら間食";
    updateDisplay();
    setTimeout(() => { isBusy = false; }, 3000);
  }

  function doExercise() {
    mood = Math.max(0, mood - 10); weight = Math.max(40, weight - 0.4);
    isBusy = true;
    const container = document.getElementById("okan-container");
    container.className = "okan-pixel anim-cleaning";
    document.getElementById("dialogue").innerText = "はいはい、掃除すればいいんでしょ！";
    document.getElementById("state-val").innerText = "部屋を掃除中";
    updateDisplay();
    setTimeout(() => {
      container.className = "okan-pixel pos-center pose-stand";
      isBusy = false;
    }, 4000);
  }

  function talk() {
    if(!checkFart()) {
      document.getElementById("dialogue").innerText = lines[Math.floor(Math.random() * lines.length)];
      document.getElementById("state-val").innerText = "会話中";
    }
    updateDisplay();
  }
</script>

</body>
</html>
