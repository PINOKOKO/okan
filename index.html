<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- スマホ用設定：拡大防止＆アプリ化 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="オカン育成">

<title>オカン育成</title>
<style>
  body {
    background-color: #222;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    user-select: none; /* スマホで文字が選択されないようにする */
    -webkit-user-select: none;
  }
  .game-container {
    background-color: #333;
    border: 4px solid #fff;
    width: 85vw;
    max-width: 320px;
    padding: 20px;
    text-align: center;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }
  .screen {
    background-color: #9bbc0f; /* レトロゲームボーイ風 */
    color: #0f380f;
    border: 4px solid #0f380f;
    height: 180px;
    margin-bottom: 15px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border-radius: 6px;
  }
  .okan {
    font-size: 55px;
    margin-bottom: 5px;
    transition: transform 0.3s;
  }
  .dialogue {
    font-size: 12px;
    background: #8bac0f;
    padding: 6px 8px;
    border: 2px solid #0f380f;
    min-height: 28px;
    width: 80%;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .status {
    margin-bottom: 15px;
    text-align: left;
    font-size: 14px;
    background: #444;
    padding: 10px;
    border-radius: 6px;
  }
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  button {
    background-color: #fff;
    color: #000;
    border: 2px solid #000;
    padding: 12px 5px;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
    border-radius: 6px;
  }
  button:active {
    background-color: #aaa;
    transform: scale(0.95);
  }
</style>
</head>
<body>

<div class="game-container" id="game" style="display:none;">
  <div class="screen">
    <div id="okan-sprite" class="okan">👵</div>
    <div id="dialogue" class="dialogue">テレビでも見ようかねぇ</div>
  </div>

  <div class="status">
    <div>機嫌: <span id="mood-bar">❤️❤️🖤🖤🖤</span> (<span id="mood-val">40</span>)</div>
    <div>体重: <span id="weight-val">55.0</span> kg</div>
  </div>

  <div class="controls">
    <button onclick="giveSake()">🍶 お酒をあげる</button>
    <button onclick="giveSnack()">🥜 おつまみ</button>
    <button onclick="doExercise()">🏃‍♀️ 運動させる</button>
    <button onclick="talk()">💬 話しかける</button>
  </div>
</div>

<script>
  // パスワード保護（いらない場合はこの判定を消してもOKです）
  const pass = prompt("合言葉を入力してね (初期値: 1234)");
  if(pass === "1234") {
    document.getElementById("game").style.display = "block";
  } else {
    alert("合言葉が違います！");
  }

  let mood = 40;
  let weight = 55.0;

  const lines = [
    "あんた、ちゃんとご飯食べてるの？",
    "今日スーパーで卵が安かったのよ〜",
    "あんたの部屋、ちょっと片付けなさいよ",
    "テレビのチャンネル、そこ変えないでよ",
    "たまには早く寝なさいね"
  ];

  function updateDisplay() {
    let hearts = "";
    let maxHearts = 5;
    let filled = Math.min(5, Math.floor(mood / 20));
    for(let i=0; i<maxHearts; i++) {
      hearts += i < filled ? "❤️" : "🖤";
    }
    document.getElementById("mood-bar").innerText = hearts;
    document.getElementById("mood-val").innerText = mood;
    document.getElementById("weight-val").innerText = weight.toFixed(1);

    const sprite = document.getElementById("okan-sprite");
    if(weight >= 65) {
      sprite.style.transform = "scale(1.3)";
    } else if(weight <= 50) {
      sprite.style.transform = "scale(0.8)";
    } else {
      sprite.style.transform = "scale(1.0)";
    }
  }

  function checkFart() {
    if (Math.random() < 0.2) {
      setTimeout(() => {
        document.getElementById("dialogue").innerText = "プッ……！ (///) あらやだ、聞こえた？";
        document.getElementById("okan-sprite").innerText = "😳";
        setTimeout(() => {
          document.getElementById("okan-sprite").innerText = "👵";
        }, 2000);
      }, 300);
      return true;
    }
    return false;
  }

  function giveSake() {
    mood = Math.min(100, mood + 15);
    weight += 0.3;
    document.getElementById("dialogue").innerText = "やだ〜、呑んじゃおうかしら♪";
    if(!checkFart()) updateDisplay();
    else updateDisplay();
  }

  function giveSnack() {
    mood = Math.min(100, mood + 10);
    weight += 0.5;
    document.getElementById("dialogue").innerText = "このしょっぱいのが美味しいのよ";
    if(!checkFart()) updateDisplay();
    else updateDisplay();
  }

  function doExercise() {
    mood = Math.max(0, mood - 10);
    weight = Math.max(40, weight - 0.4);
    document.getElementById("dialogue").innerText = "え〜、今テレビいいところなのにぃ…";
    updateDisplay();
  }

  function talk() {
    if(!checkFart()) {
      const randomLine = lines[Math.floor(Math.random() * lines.length)];
      document.getElementById("dialogue").innerText = randomLine;
    }
    updateDisplay();
  }
</script>

</body>
</html>
