  @keyframes clean-dq {
    0% { left: 30px; top: 120px; transform: scaleX(1); opacity: 1;}
    25% { opacity: 0.5; }
    50% { left: 180px; top: 80px; transform: scaleX(-1); opacity: 1;}
    75% { opacity: 0.5; }
    100% { left: 30px; top: 120px; transform: scaleX(1); opacity: 1;}
  }

    animation: clean-dq 3s infinite steps(10) !important;

  .dialogue-box {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 35px;

    font-size: 10px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    padding: 0 5px;
  }

  .status {
    margin-bottom: 12px; text-align: left; font-size: 12px;
    background: #222; padding: 8px 12px;
    border-radius: 8px; border: 2px solid #444;
  }

  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  button {
    background-color: #fff; color: #000; border: 3px solid #000;
    padding: 10px 4px; font-weight: bold; cursor: pointer;
    font-size: 11px; border-radius: 10px;
    box-shadow: 0 3px 0 #000;

  button:active { box-shadow: 0 0 0 #000; transform: translateY(3px); }

<body>

<div class="game-container" id="game" style="display:none;">
  <div class="screen">
    <!--背景とお部屋 (精巧なドット絵家具) -->
    <div class="room-bg">
      <div class="furniture clock"></div>
      <div class="furniture tv-set"></div>
      <div class="furniture ちゃぶ台"></div>
    </div>

    <!-- 精巧全身ドット絵オカン -->
    <div id="okan-container" class="okan-pixel pos-tv pose-stand">
      <div id="fart-pixel" class="fart-pixel"></div>
    </div>

    <!-- メッセージ -->
    <div id="dialogue" class="dialogue-box">テレビでも見ようかねぇ</div>
  </div>

  <div class="status">
    <div>機嫌: <span id="mood-bar">❤️❤️🖤🖤🖤</span></div>
    <div>体重: <span id="weight-val">55.0</span> kg</div>
    <div>行動: <span id="state-val">テレビ鑑賞</span></div>
  </div>

  <div class="controls">
    <button onclick="giveSake()">🍶 お酒あげる</button>
    <button onclick="giveSnack()">🥜 おつまみ</button>
    <button onclick="doExercise()">🧹 部屋掃除</button>
    <button onclick="talk()">💬 話しかける</button>
  </div>
</div>

<script>
  const pass = prompt("合言葉を入力してね (初期値: 1234)");
  if(pass === "1234") {
    document.getElementById("game").style.display = "block";
  } else {
    alert("合言葉が違います！");
  }

  let mood = 40;
  let weight = 55.0;
  let isBusy = false;
  let blinkTimer;

  const lines = [
    "あんた、ちゃんとご飯食べてるの？",
    "今日スーパーで卵が安かったのよ～",
    "あんたの部屋、ちょっと片付けなさいよ",
    "テレビのチャンネル、そこ変えないでよ"
  ];

  const idleStates = [
    { pos: "pos-tv", pose: "pose-stand", text: "ワイドショーを真剣に見ている", state: "テレビ鑑賞" },
    { pos: "pos-ちゃぶ台", pose: "pose-lay", text: "ちゃぶ台の横でゴロゴロ寝転がっている", state: "ゴロゴロ居眠り" },
    { pos: "pos-center", pose: "pose-stand", text: "部屋の真ん中でぼーっとしている", state: "立ち話" }
  ];

  function updateDisplay() {
    let hearts = "";
    let filled = Math.min(5, Math.floor(mood / 20));
    for(let i=0; i<5; i++) { hearts += i < filled ? "❤️" : "🖤"; }
    document.getElementById("mood-bar").innerText = hearts;
    document.getElementById("weight-val").innerText = weight.toFixed(1);
  }

  // ⭐ 瞬きアニメーション (1.5秒ごとにパチパチ)
  function startBlinking() {
    blinkTimer = setInterval(() => {
      const okan = document.getElementById("okan-container");
      if (okan.className.includes("pose-stand")) {
        okan.classList.remove("pose-stand");
        okan.classList.add("pose-blink");
        setTimeout(() => {
          okan.classList.remove("pose-blink");
          okan.classList.add("pose-stand");
        }, 150); // 瞬き時間
      }
    }, 1500);
  }
  startBlinking();

  // 行動切り替え
  setInterval(() => {
    if (isBusy) return;
    const action = idleStates[Math.floor(Math.random() * idleStates.length)];
    const container = document.getElementById("okan-container");
    container.className = `okan-pixel ${action.pos} ${action.pose}`;
    document.getElementById("dialogue").innerText = action.text;
    document.getElementById("state-val").innerText = action.state;
  }, 4000);

  function checkFart() {
    if (Math.random() < 0.3) {
      isBusy = true;
      const container = document.getElementById("okan-container");
      const fart = document.getElementById("fart-pixel");
      container.className = "okan-pixel pos-ちゃぶ台 pose-lay";
      setTimeout(() => {
        fart.className = "fart-pixel fart-active";
        document.getElementById("dialogue").innerText = "……プゥッ！あらやだ！";
        document.getElementById("state-val").innerText = "放屁(寝ながら)";
      }, 300);
      setTimeout(() => {
        fart.className = "fart-pixel";
        isBusy = false;
      }, 3000);
      return true;
    }
    return false;
  }

  function giveSake() {
    mood = Math.min(100, mood + 15); weight += 0.3;
    isBusy = true;
    const container = document.getElementById("okan-container");
    container.className = "okan-pixel pos-ちゃぶ台 pose-stand";
    document.getElementById("dialogue").innerText = "やだ～、呑んじゃおうかしら♪";
    document.getElementById("state-val").innerText = "晩酌中";
    updateDisplay();
    setTimeout(() => { isBusy = false; }, 3000);
  }

  function giveSnack() {
    mood = Math.min(100, mood + 10); weight += 0.5;
    isBusy = true;
    const container = document.getElementById("okan-container");
    container.className = "okan-pixel pos-ちゃぶ台 pose-lay";
    document.getElementById("dialogue").innerText = "寝っ転がって食べるおせんべいが最高";
    document.getElementById("state-val").innerText = "寝ながら間食";
    updateDisplay();
    setTimeout(() => { isBusy = false; }, 3000);
  }

  function doExercise() {
    mood = Math.max(0, mood - 10); weight = Math.max(40, weight - 0.4);
    isBusy = true;
    const container = document.getElementById("okan-container");
    container.className = "okan-pixel anim-cleaning";
    document.getElementById("dialogue").innerText = "え～、掃除ぃ？…";
    document.getElementById("state-val").innerText = "部屋を掃除中";
    updateDisplay();
    setTimeout(() => {
      container.className = "okan-pixel pos-center pose-stand";
      isBusy = false;
    }, 4000);
  }

  function talk() {
    if(!checkFart()) {
      document.getElementById("dialogue").innerText = lines[Math.floor(Math.random() * lines.length)];
      document.getElementById("state-val").innerText = "会話中";
    }
    updateDisplay();
  }
</script>

</body>
</html>
