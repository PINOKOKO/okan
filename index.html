<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="オカン育成">

<title>オカン育成</title>
<style>
  body {
    background-color: #111;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  /* たまごっち本体風フレーム */
  .game-container {
    background-color: #e0829d;
    border: 5px solid #222;
    width: 88vw;
    max-width: 330px;
    padding: 18px;
    text-align: center;
    border-radius: 42px;
    box-shadow: 0 8px 0 #000, inset 0 4px 0 rgba(255,255,255,0.4);
  }

  /* ドット絵ドールハウス画面 */
  .screen {
    background-color: #9bbc0f; /* 液晶カラー */
    color: #0f380f;
    border: 4px solid #0f380f;
    height: 220px;
    margin-bottom: 12px;
    border-radius: 10px;
    position: relative;
    overflow: hidden; /* 部屋からはみ出ないようにする */
    box-shadow: inset 3px 3px 6px rgba(0,0,0,0.3);
  }

  /* --- 部屋のレイアウト --- */
  .room-bg {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 35px; /* 上半分が部屋空間 */
    border-bottom: 3px double #0f380f; /* 畳/フローリングの境目 */
  }

  /* 家具の配置 (引きの構図用) */
  .furniture {
    position: absolute;
    font-size: 24px;
    line-height: 1;
  }
  .tv-set { top: 15px; left: 15px; text-align: center; }
  .tv-screen { font-size: 28px; }
  .kotatsu { bottom: 10px; right: 20px; font-size: 32px; }
  .window { top: 10px; right: 15px; font-size: 20px; opacity: 0.8; }
  .clock { top: 10px; left: 50%; transform: translateX(-50%); font-size: 16px; }

  /* オカンの位置（動的にCSSクラスで切り替え） */
  .okan {
    position: absolute;
    font-size: 36px;
    transition: all 0.8s ease-in-out; /* なめらかに移動 */
    z-index: 10;
  }

  /* オカンの位置パターン */
  .pos-tv { top: 60px; left: 30px; }            /* テレビ前 */
  .pos-kotatsu { top: 95px; right: 55px; }       /* コタツ */
  .pos-center { top: 80px; left: 45%; }          /* 部屋中央 */

  /* アニメーション：掃除（左右にドタバタ動く） */
  @keyframes clean-walk {
    0% { left: 20px; top: 100px; transform: scaleX(1); }
    50% { left: 200px; top: 70px; transform: scaleX(-1); }
    100% { left: 20px; top: 100px; transform: scaleX(1); }
  }
  .anim-cleaning {
    animation: clean-walk 3s infinite linear !important;
  }

  /* アニメーション：だらだら微振動 */
  @keyframes chill {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2px); }
  }
  .anim-chill {
    animation: chill 1.5s infinite ease-in-out;
  }

  /* ダイアログ（吹き出し） */
  .dialogue-box {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 35px;
    background: #8bac0f;
    border-top: 2px solid #0f380f;
    font-size: 10px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 5px;
  }

  .status {
    margin-bottom: 12px;
    text-align: left;
    font-size: 12px;
    background: #222;
    padding: 8px 12px;
    border-radius: 8px;
    border: 2px solid #444;
  }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  button {
    background-color: #fff;
    color: #000;
    border: 3px solid #000;
    padding: 10px 4px;
    font-weight: bold;
    cursor: pointer;
    font-size: 11px;
    border-radius: 10px;
    box-shadow: 0 3px 0 #000;
  }

  button:active {
    box-shadow: 0 0 0 #000;
    transform: translateY(3px);
  }
</style>
</head>
<body>

<div class="game-container" id="game" style="display:none;">
  <div class="screen">
    <!-- 背景とお部屋の家具 -->
    <div class="room-bg">
      <div class="furniture clock">⏰</div>
      <div class="furniture window">🪟</div>
      <div class="furniture tv-set">
        <div class="tv-screen" id="tv-icon">📺</div>
      </div>
      <div class="furniture kotatsu">🪑</div>
    </div>

    <!-- 引きの構図で動くオカン -->
    <div id="okan-sprite" class="okan pos-tv anim-chill">👵</div>

    <!-- 画面下のメッセージ -->
    <div id="dialogue" class="dialogue-box">テレビでも見ようかねぇ</div>
  </div>

  <div class="status">
    <div>機嫌: <span id="mood-bar">❤️❤️🖤🖤🖤</span> (<span id="mood-val">40</span>)</div>
    <div>体重: <span id="weight-val">55.0</span> kg</div>
    <div>行動: <span id="state-val">テレビ鑑賞</span></div>
  </div>

  <div class="controls">
    <button onclick="giveSake()">🍶 お酒あげる</button>
    <button onclick="giveSnack()">🥜 おつまみ</button>
    <button onclick="doExercise()">🧹 部屋掃除</button>
    <button onclick="talk()">💬 話しかける</button>
  </div>
</div>

<script>
  const pass = prompt("合言葉を入力してね (初期値: 1234)");
  if(pass === "1234") {
    document.getElementById("game").style.display = "block";
  } else {
    alert("合言葉が違います！");
  }

  let mood = 40;
  let weight = 55.0;
  let isBusy = false;

  const lines = [
    "あんた、ちゃんとご飯食べてるの？",
    "今日スーパーで卵が安かったのよ～",
    "あんたの部屋、ちょっと片付けなさいよ",
    "テレビのチャンネル、そこ変えないでよ",
    "たまには早く寝なさいね"
  ];

  // オカンの行動パターン（位置・スプライト・テキスト）
  const idleStates = [
    { pos: "pos-tv", anim: "anim-chill", sprite: "👵", tv: "📺", text: "ワイドショーを真剣に見ている", state: "テレビ鑑賞" },
    { pos: "pos-kotatsu", anim: "anim-chill", sprite: "😴", tv: "📺", text: "コタツの横で横になって寝ている", state: "居眠り" },
    { pos: "pos-kotatsu", anim: "anim-chill", sprite: "🍵", tv: "📺", text: "コタツでお茶をすすっている", state: "お茶タイム" },
    { pos: "pos-center", anim: "anim-chill", sprite: "📱", tv: "📺", text: "部屋の真ん中でスマホを眺めている", state: "スマホ操作" }
  ];

  function updateDisplay() {
    let hearts = "";
    let filled = Math.min(5, Math.floor(mood / 20));
    for(let i=0; i<5; i++) {
      hearts += i < filled ? "❤️" : "🖤";
    }
    document.getElementById("mood-bar").innerText = hearts;
    document.getElementById("mood-val").innerText = mood;
    document.getElementById("weight-val").innerText = weight.toFixed(1);
  }

  // 4秒ごとに部屋の中を勝手に移動＆ダラダラ変化
  setInterval(() => {
    if (isBusy) return;
    const action = idleStates[Math.floor(Math.random() * idleStates.length)];
    
    const okan = document.getElementById("okan-sprite");
    okan.className = `okan ${action.pos} ${action.anim}`;
    okan.innerText = action.sprite;
    
    document.getElementById("tv-icon").innerText = action.tv;
    document.getElementById("dialogue").innerText = action.text;
    document.getElementById("state-val").innerText = action.state;
  }, 4000);

  function checkFart() {
    if (Math.random() < 0.25) {
      isBusy = true;
      const okan = document.getElementById("okan-sprite");
      okan.className = "okan pos-center anim-chill";
      okan.innerText = "😳";
      
      document.getElementById("dialogue").innerText = "プッ……！ (///) あらやだ、聞こえた？";
      document.getElementById("state-val").innerText = "放屁";

      setTimeout(() => {
        okan.innerText = "👵";
        isBusy = false;
      }, 2500);
      return true;
    }
    return false;
  }

  function giveSake() {
    mood = Math.min(100, mood + 15);
    weight += 0.3;
    isBusy = true;
    
    const okan = document.getElementById("okan-sprite");
    okan.className = "okan pos-kotatsu anim-chill";
    okan.innerText = "🍶";
    
    document.getElementById("dialogue").innerText = "やだ～、呑んじゃおうかしら♪";
    document.getElementById("state-val").innerText = "晩酌中";
    
    updateDisplay();
    setTimeout(() => { isBusy = false; }, 3000);
  }

  function giveSnack() {
    mood = Math.min(100, mood + 10);
    weight += 0.5;
    isBusy = true;

    const okan = document.getElementById("okan-sprite");
    okan.className = "okan pos-kotatsu anim-chill";
    okan.innerText = "🍘";

    document.getElementById("dialogue").innerText = "このしょっぱいのが美味しいのよ";
    document.getElementById("state-val").innerText = "間食中";

    updateDisplay();
    setTimeout(() => { isBusy = false; }, 3000);
  }

  function doExercise() {
    mood = Math.max(0, mood - 10);
    weight = Math.max(40, weight - 0.4);
    isBusy = true;

    const okan = document.getElementById("okan-sprite");
    // 掃除中アニメーションを適用して部屋中を動かす
    okan.className = "okan anim-cleaning";
    okan.innerText = "🧹";

    document.getElementById("dialogue").innerText = "え～、今ドラマいいところなのにぃ…";
    document.getElementById("state-val").innerText = "部屋を掃除中";

    updateDisplay();
    setTimeout(() => {
      okan.className = "okan pos-center anim-chill";
      okan.innerText = "👵";
      isBusy = false;
    }, 4000);
  }

  function talk() {
    if(!checkFart()) {
      document.getElementById("dialogue").innerText = lines[Math.floor(Math.random() * lines.length)];
      document.getElementById("state-val").innerText = "会話中";
    }
    updateDisplay();
  }
</script>

</body>
</html>
