<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="オカン育成">

<title>オカン育成</title>
<style>
  body {
    background-color: #111;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  /* たまごっち本体風フレーム */
  .game-container {
    background-color: #e0829d;
    border: 5px solid #222;
    width: 88vw;
    max-width: 330px;
    padding: 18px;
    text-align: center;
    border-radius: 42px;
    box-shadow: 0 8px 0 #000, inset 0 4px 0 rgba(255,255,255,0.4);
  }

  /* 液晶画面（ゲームボーイ/たまごっち風モノクログリーン） */
  .screen {
    background-color: #9bbc0f;
    color: #0f380f;
    border: 4px solid #0f380f;
    height: 220px;
    margin-bottom: 12px;
    border-radius: 10px;
    position: relative;
    overflow: hidden;
    box-shadow: inset 3px 3px 6px rgba(0,0,0,0.3);
  }

  /* お部屋のレイアウト */
  .room-bg {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 35px;
    border-bottom: 3px double #0f380f;
  }

  .furniture {
    position: absolute;
    font-size: 24px;
    line-height: 1;
  }
  .tv-set { top: 15px; left: 15px; text-align: center; }
  .tv-screen { font-size: 28px; }
  .kotatsu { bottom: 10px; right: 15px; font-size: 32px; }
  .window { top: 10px; right: 15px; font-size: 20px; opacity: 0.8; }
  .clock { top: 10px; left: 50%; transform: translateX(-50%); font-size: 16px; }

  /* -------------------------------------
     二頭身オカンのパーツ組み上げ
  ------------------------------------- */
  .okan-container {
    position: absolute;
    transition: all 0.8s ease-in-out;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 二頭身の頭 */
  .okan-head {
    font-size: 26px;
    line-height: 1;
  }
  /* 二頭身の体（エプロン・服） */
  .okan-body {
    font-size: 18px;
    line-height: 0.8;
    margin-top: -4px;
  }

  /* 位置パターン */
  .pos-tv { top: 60px; left: 35px; }
  .pos-kotatsu { top: 90px; right: 55px; }
  .pos-center { top: 75px; left: 40%; }

  /* --- ポーズ1：立ち姿（通常） --- */
  .pose-stand {
    flex-direction: column;
    transform: rotate(0deg);
  }

  /* --- ポーズ2：寝っ転がり姿（横になる） --- */
  .pose-lay {
    flex-direction: row-reverse !important; /* 横向き */
    transform: rotate(90deg) translateY(-10px);
  }

  /* おならエフェクト（ぷぅ💨） */
  .fart-cloud {
    position: absolute;
    font-size: 20px;
    opacity: 0;
    transition: all 0.3s ease;
  }
  .fart-active {
    opacity: 1;
    animation: fart-bounce 0.6s infinite alternate;
  }
  @keyframes fart-bounce {
    0% { transform: scale(0.8) translate(0, 0); }
    100% { transform: scale(1.2) translate(5px, -5px); }
  }

  /* アニメーション：掃除 */
  @keyframes clean-walk {
    0% { left: 20px; top: 95px; transform: scaleX(1); }
    50% { left: 190px; top: 65px; transform: scaleX(-1); }
    100% { left: 20px; top: 95px; transform: scaleX(1); }
  }
  .anim-cleaning {
    animation: clean-walk 3s infinite linear !important;
  }

  /* ダイアログ（吹き出し） */
  .dialogue-box {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 35px;
    background: #8bac0f;
    border-top: 2px solid #0f380f;
    font-size: 10px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 5px;
  }

  .status {
    margin-bottom: 12px;
    text-align: left;
    font-size: 12px;
    background: #222;
    padding: 8px 12px;
    border-radius: 8px;
    border: 2px solid #444;
  }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  button {
    background-color: #fff;
    color: #000;
    border: 3px solid #000;
    padding: 10px 4px;
    font-weight: bold;
    cursor: pointer;
    font-size: 11px;
    border-radius: 10px;
    box-shadow: 0 3px 0 #000;
  }

  button:active {
    box-shadow: 0 0 0 #000;
    transform: translateY(3px);
  }
</style>
</head>
<body>

<div class="game-container" id="game" style="display:none;">
  <div class="screen">
    <!-- 背景とお部屋の家具 -->
    <div class="room-bg">
      <div class="furniture clock">⏰</div>
      <div class="furniture window">🪟</div>
      <div class="furniture tv-set">
        <div class="tv-screen" id="tv-icon">📺</div>
      </div>
      <div class="furniture kotatsu">🪑</div>
    </div>

    <!-- 二頭身ドット風オカン -->
    <div id="okan-container" class="okan-container pos-tv pose-stand">
      <div id="okan-head" class="okan-head">👵</div>
      <div id="okan-body" class="okan-body">🎽</div>
      <div id="fart-cloud" class="fart-cloud">💨</div>
    </div>

    <!-- 画面下のメッセージ -->
    <div id="dialogue" class="dialogue-box">テレビでも見ようかねぇ</div>
  </div>

  <div class="status">
    <div>機嫌: <span id="mood-bar">❤️❤️🖤🖤🖤</span> (<span id="mood-val">40</span>)</div>
    <div>体重: <span id="weight-val">55.0</span> kg</div>
    <div>行動: <span id="state-val">テレビ鑑賞</span></div>
  </div>

  <div class="controls">
    <button onclick="giveSake()">🍶 お酒あげる</button>
    <button onclick="giveSnack()">🥜 おつまみ</button>
    <button onclick="doExercise()">🧹 部屋掃除</button>
    <button onclick="talk()">💬 話しかける</button>
  </div>
</div>

<script>
  const pass = prompt("合言葉を入力してね (初期値: 1234)");
  if(pass === "1234") {
    document.getElementById("game").style.display = "block";
  } else {
    alert("合言葉が違います！");
  }

  let mood = 40;
  let weight = 55.0;
  let isBusy = false;

  const lines = [
    "あんた、ちゃんとご飯食べてるの？",
    "今日スーパーで卵が安かったのよ～",
    "あんたの部屋、ちょっと片付けなさいよ",
    "テレビのチャンネル、そこ変えないでよ",
    "たまには早く寝なさいね"
  ];

  // オカンの行動パターン
  const idleStates = [
    { pos: "pos-tv", pose: "pose-stand", head: "👵", body: "🎽", tv: "📺", text: "ワイドショーを真剣に見ている", state: "テレビ鑑賞" },
    { pos: "pos-kotatsu", pose: "pose-lay", head: "😴", body: "🎽", tv: "📺", text: "コタツの横でゴロゴロ寝転がっている", state: "ゴロゴロ居眠り" },
    { pos: "pos-kotatsu", pose: "pose-stand", head: "🍵", body: "🎽", tv: "📺", text: "コタツでお茶をすすっている", state: "お茶タイム" },
    { pos: "pos-center", pose: "pose-stand", head: "📱", body: "🎽", tv: "📺", text: "部屋の真ん中でスマホを眺めている", state: "スマホ操作" }
  ];

  function updateDisplay() {
    let hearts = "";
    let filled = Math.min(5, Math.floor(mood / 20));
    for(let i=0; i<5; i++) {
      hearts += i < filled ? "❤️" : "🖤";
    }
    document.getElementById("mood-bar").innerText = hearts;
    document.getElementById("mood-val").innerText = mood;
    document.getElementById("weight-val").innerText = weight.toFixed(1);
  }

  // 4秒ごとに放置アニメーション切り替え
  setInterval(() => {
    if (isBusy) return;
    const action = idleStates[Math.floor(Math.random() * idleStates.length)];
    
    const container = document.getElementById("okan-container");
    container.className = `okan-container ${action.pos} ${action.pose}`;
    
    document.getElementById("okan-head").innerText = action.head;
    document.getElementById("okan-body").innerText = action.body;
    document.getElementById("tv-icon").innerText = action.tv;
    document.getElementById("dialogue").innerText = action.text;
    document.getElementById("state-val").innerText = action.state;
  }, 4000);

  // ⭐ 寝っ転がっておならする演出 ⭐
  function checkFart() {
    if (Math.random() < 0.3) {
      isBusy = true;
      const container = document.getElementById("okan-container");
      const fart = document.getElementById("fart-cloud");

      // コタツ横に寝っ転がらせる
      container.className = "okan-container pos-kotatsu pose-lay";
      document.getElementById("okan-head").innerText = "😳";
      document.getElementById("okan-body").innerText = "🎽";

      // 0.3秒後にお尻からプゥ💨と出す
      setTimeout(() => {
        fart.className = "fart-cloud fart-active";
        document.getElementById("dialogue").innerText = "（寝っ転がりながら）……プゥッ！あらやだ！";
        document.getElementById("state-val").innerText = "放屁(寝ながら)";
      }, 300);

      setTimeout(() => {
        fart.className = "fart-cloud";
        document.getElementById("okan-head").innerText = "👵";
        isBusy = false;
      }, 3000);
      return true;
    }
    return false;
  }

  function giveSake() {
    mood = Math.min(100, mood + 15);
    weight += 0.3;
    isBusy = true;
    
    const container = document.getElementById("okan-container");
    container.className = "okan-container pos-kotatsu pose-stand";
    document.getElementById("okan-head").innerText = "🍶";
    document.getElementById("okan-body").innerText = "🎽";
    
    document.getElementById("dialogue").innerText = "やだ～、呑んじゃおうかしら♪";
    document.getElementById("state-val").innerText = "晩酌中";
    
    updateDisplay();
    setTimeout(() => { isBusy = false; }, 3000);
  }

  function giveSnack() {
    mood = Math.min(100, mood + 10);
    weight += 0.5;
    isBusy = true;

    const container = document.getElementById("okan-container");
    container.className = "okan-container pos-kotatsu pose-lay";
    document.getElementById("okan-head").innerText = "🍘";
    document.getElementById("okan-body").innerText = "🎽";

    document.getElementById("dialogue").innerText = "寝っ転がって食べるおせんべいが最高なのよ";
    document.getElementById("state-val").innerText = "寝ながら間食";

    updateDisplay();
    setTimeout(() => { isBusy = false; }, 3000);
  }

  function doExercise() {
    mood = Math.max(0, mood - 10);
    weight = Math.max(40, weight - 0.4);
    isBusy = true;

    const container = document.getElementById("okan-container");
    container.className = "okan-container anim-cleaning";
    document.getElementById("okan-head").innerText = "🧹";
    document.getElementById("okan-body").innerText = "🎽";

    document.getElementById("dialogue").innerText = "え～、今ドラマいいところなのにぃ…";
    document.getElementById("state-val").innerText = "部屋を掃除中";

    updateDisplay();
    setTimeout(() => {
      container.className = "okan-container pos-center pose-stand";
      document.getElementById("okan-head").innerText = "👵";
      isBusy = false;
    }, 4000);
  }

  function talk() {
    if(!checkFart()) {
      document.getElementById("dialogue").innerText = lines[Math.floor(Math.random() * lines.length)];
      document.getElementById("state-val").innerText = "会話中";
    }
    updateDisplay();
  }
</script>

</body>
</html>
